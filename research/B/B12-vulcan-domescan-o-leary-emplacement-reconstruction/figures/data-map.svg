<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1476" viewBox="0 0 1040 1476" role="img" aria-labelledby="title description"><title id="title">B12 proposed data contract — 7 defined fields</title><desc id="description">Proposed data contract for B12, VULCAN DOMESCAN — O’Leary Emplacement Reconstruction. No project observations have been acquired. Every dictionary field is shown with its type and unit: dem_elevation, type float raster, unit m; contact_segment, type polyline, unit m; basal_surface, type float64[scenario,row,column], unit m; yield_stress, type float[], unit Pa; consistency, type float[], unit Pa s^n; extrusion_rate, type float[], unit m³/s; metric_covariance, type matrix, unit mixed. The collection, qualification, validation and preservation flow is planned, not executed.</desc><rect x="0" y="0" width="1040" height="1476" rx="18" fill="#f7f8f5"/><rect x="0" y="0" width="1040" height="12" rx="6" fill="#1d676d"/><text x="38" y="49" fill="#206870" font-size="13" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.4">B12 / DATA DEFINITION ATLAS</text><text x="1000" y="49" fill="#206870" font-size="13" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="end" letter-spacing="1.4">07 FIELDS</text><text x="38" y="98" fill="#16324a" font-size="29" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start">VULCAN DOMESCAN</text><text x="38" y="132" fill="#80542f" font-size="15" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="0.7">PROPOSED DATA CONTRACT</text><text x="38" y="160" fill="#52687b" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">No project observations acquired · acquisition template contains headers only</text><text x="38" y="188" fill="#52687b" font-size="15" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Field names, types and units below come directly from the versioned engineering dictionary.</text><line x1="38" y1="211" x2="1002" y2="211" stroke="#dce5e7" stroke-width="1"/><rect x="38" y="250" width="464" height="216" rx="14" fill="#ffffff" stroke="#dce5e7"/><rect x="38" y="268" width="4" height="180" rx="2" fill="#277f79"/><text x="60" y="278" fill="#477478" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.3">01 / FIELD DEFINITION</text><text x="60" y="306" fill="#16324a" font-size="19" font-weight="700" font-family="Consolas, Menlo, monospace" text-anchor="start">dem_elevation</text><text x="60" y="336" fill="#52687b" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.2">TYPE</text><text x="60" y="360" fill="#174f5c" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">float raster</text><text x="60" y="387" fill="#52687b" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.2">UNIT</text><text x="60" y="411" fill="#16324a" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">m</text><text x="60" y="440" fill="#52687b" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Modern topography.</text><rect x="538" y="250" width="464" height="216" rx="14" fill="#ffffff" stroke="#dce5e7"/><rect x="538" y="268" width="4" height="180" rx="2" fill="#277f79"/><text x="560" y="278" fill="#477478" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.3">02 / FIELD DEFINITION</text><text x="560" y="306" fill="#16324a" font-size="19" font-weight="700" font-family="Consolas, Menlo, monospace" text-anchor="start">contact_segment</text><text x="560" y="336" fill="#52687b" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.2">TYPE</text><text x="560" y="360" fill="#174f5c" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">polyline</text><text x="560" y="387" fill="#52687b" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.2">UNIT</text><text x="560" y="411" fill="#16324a" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">m</text><text x="560" y="440" fill="#52687b" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Mapped volcanic-unit boundary.</text><rect x="38" y="486" width="464" height="236" rx="14" fill="#ffffff" stroke="#dce5e7"/><rect x="38" y="504" width="4" height="200" rx="2" fill="#277f79"/><text x="60" y="514" fill="#477478" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.3">03 / FIELD DEFINITION</text><text x="60" y="542" fill="#16324a" font-size="19" font-weight="700" font-family="Consolas, Menlo, monospace" text-anchor="start">basal_surface</text><text x="60" y="572" fill="#52687b" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.2">TYPE</text><text x="60" y="596" fill="#174f5c" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">float64[scenario,row,column]</text><text x="60" y="623" fill="#52687b" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.2">UNIT</text><text x="60" y="647" fill="#16324a" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">m</text><text x="60" y="676" fill="#52687b" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Pre-emplacement surface ensemble, indexed scenario</text><text x="60" y="696" fill="#52687b" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">then raster row then column.</text><rect x="538" y="486" width="464" height="236" rx="14" fill="#ffffff" stroke="#dce5e7"/><rect x="538" y="504" width="4" height="200" rx="2" fill="#277f79"/><text x="560" y="514" fill="#477478" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.3">04 / FIELD DEFINITION</text><text x="560" y="542" fill="#16324a" font-size="19" font-weight="700" font-family="Consolas, Menlo, monospace" text-anchor="start">yield_stress</text><text x="560" y="572" fill="#52687b" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.2">TYPE</text><text x="560" y="596" fill="#174f5c" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">float[]</text><text x="560" y="623" fill="#52687b" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.2">UNIT</text><text x="560" y="647" fill="#16324a" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Pa</text><text x="560" y="676" fill="#52687b" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Scenario material yield parameter.</text><rect x="38" y="742" width="464" height="216" rx="14" fill="#ffffff" stroke="#dce5e7"/><rect x="38" y="760" width="4" height="180" rx="2" fill="#277f79"/><text x="60" y="770" fill="#477478" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.3">05 / FIELD DEFINITION</text><text x="60" y="798" fill="#16324a" font-size="19" font-weight="700" font-family="Consolas, Menlo, monospace" text-anchor="start">consistency</text><text x="60" y="828" fill="#52687b" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.2">TYPE</text><text x="60" y="852" fill="#174f5c" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">float[]</text><text x="60" y="879" fill="#52687b" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.2">UNIT</text><text x="60" y="903" fill="#16324a" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Pa s^n</text><text x="60" y="932" fill="#52687b" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Flow consistency parameter.</text><rect x="538" y="742" width="464" height="216" rx="14" fill="#ffffff" stroke="#dce5e7"/><rect x="538" y="760" width="4" height="180" rx="2" fill="#277f79"/><text x="560" y="770" fill="#477478" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.3">06 / FIELD DEFINITION</text><text x="560" y="798" fill="#16324a" font-size="19" font-weight="700" font-family="Consolas, Menlo, monospace" text-anchor="start">extrusion_rate</text><text x="560" y="828" fill="#52687b" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.2">TYPE</text><text x="560" y="852" fill="#174f5c" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">float[]</text><text x="560" y="879" fill="#52687b" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.2">UNIT</text><text x="560" y="903" fill="#16324a" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">m³/s</text><text x="560" y="932" fill="#52687b" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Scenario vent supply history.</text><rect x="38" y="978" width="464" height="216" rx="14" fill="#ffffff" stroke="#dce5e7"/><rect x="38" y="996" width="4" height="180" rx="2" fill="#277f79"/><text x="60" y="1006" fill="#477478" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.3">07 / FIELD DEFINITION</text><text x="60" y="1034" fill="#16324a" font-size="19" font-weight="700" font-family="Consolas, Menlo, monospace" text-anchor="start">metric_covariance</text><text x="60" y="1064" fill="#52687b" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.2">TYPE</text><text x="60" y="1088" fill="#174f5c" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">matrix</text><text x="60" y="1115" fill="#52687b" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.2">UNIT</text><text x="60" y="1139" fill="#16324a" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">mixed</text><text x="60" y="1168" fill="#52687b" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Joint volume/slope/contact uncertainty.</text><rect x="538" y="978" width="464" height="216" rx="14" fill="#edf3f0" stroke="#d8e5df"/><g opacity="0.46"><ellipse cx="770" cy="1070.88" rx="58.32" ry="33.83" fill="none" stroke="#3a9183" stroke-width="1.4" transform="rotate(-28 770 1070.88)"/><ellipse cx="770" cy="1070.88" rx="44.32" ry="25.71" fill="none" stroke="#3a9183" stroke-width="1.4" transform="rotate(34 770 1070.88)"/><ellipse cx="770" cy="1070.88" rx="29.16" ry="16.91" fill="none" stroke="#3a9183" stroke-width="1.4" transform="rotate(-28 770 1070.88)"/><circle cx="770" cy="1070.88" r="14.58" fill="#0d2a43" stroke="#e9ac78" stroke-width="2"/><circle cx="759.87" cy="1031.82" r="4" fill="#e9ac78" stroke="#3a9183" stroke-width="1.2"/><circle cx="799.16" cy="1036.54" r="4" fill="#e9ac78" stroke="#3a9183" stroke-width="1.2"/><circle cx="824.80" cy="1057.32" r="4" fill="#e9ac78" stroke="#3a9183" stroke-width="1.2"/><circle cx="824.80" cy="1084.44" r="4" fill="#e9ac78" stroke="#3a9183" stroke-width="1.2"/><circle cx="799.16" cy="1105.22" r="4" fill="#e9ac78" stroke="#3a9183" stroke-width="1.2"/><circle cx="759.87" cy="1109.94" r="4" fill="#e9ac78" stroke="#3a9183" stroke-width="1.2"/><circle cx="725.32" cy="1096.37" r="4" fill="#e9ac78" stroke="#3a9183" stroke-width="1.2"/><circle cx="711.68" cy="1070.88" r="4" fill="#e9ac78" stroke="#3a9183" stroke-width="1.2"/><circle cx="725.32" cy="1045.39" r="4" fill="#e9ac78" stroke="#3a9183" stroke-width="1.2"/></g><text x="770" y="1150" fill="#44776f" font-size="12" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">DEFINED FIELDS ≠ ACQUIRED DATA</text><text x="770" y="1172" fill="#44776f" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">A contract specifies a future record.</text><text x="38" y="1238" fill="#206870" font-size="12" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.5">THE RECORD ENVELOPE</text><rect x="38" y="1258" width="214" height="92" rx="12" fill="#edf2f1"/><text x="56" y="1282" fill="#48787d" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start">01</text><text x="56" y="1306" fill="#16324a" font-size="17" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start">COLLECT</text><text x="56" y="1329" fill="#52687b" font-size="13" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Future acquisition</text><line x1="257" y1="1303" x2="280" y2="1303" stroke="#61948b" stroke-width="1.5"/><path d="M273 1298 L280 1303 L273 1308" fill="none" stroke="#61948b" stroke-width="1.5"/><rect x="288" y="1258" width="214" height="92" rx="12" fill="#edf2f1"/><text x="306" y="1282" fill="#48787d" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start">02</text><text x="306" y="1306" fill="#16324a" font-size="17" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start">QUALIFY</text><text x="306" y="1329" fill="#52687b" font-size="13" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Frame + calibration</text><line x1="507" y1="1303" x2="530" y2="1303" stroke="#61948b" stroke-width="1.5"/><path d="M523 1298 L530 1303 L523 1308" fill="none" stroke="#61948b" stroke-width="1.5"/><rect x="538" y="1258" width="214" height="92" rx="12" fill="#edf2f1"/><text x="556" y="1282" fill="#48787d" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start">03</text><text x="556" y="1306" fill="#16324a" font-size="17" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start">VALIDATE</text><text x="556" y="1329" fill="#52687b" font-size="13" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Shape + domain rules</text><line x1="757" y1="1303" x2="780" y2="1303" stroke="#61948b" stroke-width="1.5"/><path d="M773 1298 L780 1303 L773 1308" fill="none" stroke="#61948b" stroke-width="1.5"/><rect x="788" y="1258" width="214" height="92" rx="12" fill="#0d2a43"/><text x="806" y="1282" fill="#65d8c0" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start">04</text><text x="806" y="1306" fill="#ffffff" font-size="17" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start">PRESERVE</text><text x="806" y="1329" fill="#c4d6df" font-size="13" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Version + provenance</text><text x="38" y="1384" fill="#52687b" font-size="15" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Missing values stay unknown; zero is never a substitute for an absent measurement.</text><text x="38" y="1412" fill="#52687b" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">A schema checks structure. Physical bounds, covariance, units and calibration still require domain checks.</text><line x1="38" y1="1430" x2="1002" y2="1430" stroke="#dce5e7" stroke-width="1"/><text x="38" y="1456" fill="#627b88" font-size="11" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">ATLAS / SESSION B / B12 · Source: engineering_annexes.json</text><text x="1002" y="1456" fill="#80542f" font-size="11" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="end">SCHEMATIC · NO EXPERIMENTAL RESULTS</text></svg>
