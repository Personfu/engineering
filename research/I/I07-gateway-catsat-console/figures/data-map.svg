<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1456" viewBox="0 0 1040 1456" role="img" aria-labelledby="title description"><title id="title">I07 proposed data contract — 8 defined fields</title><desc id="description">Proposed data contract for I07, GATEWAY CATSAT CONSOLE. No project observations have been acquired. Every dictionary field is shown with its type and unit: event_id, type string, unit 1; source_receive_time, type float64[2], unit s declared scale; engineering_value, type typed scalar|null, unit dictionary-declared; quality_age, type struct, unit 1, s; image_manifest, type struct, unit byte, chunk count; chunk_record, type bytes+ID+checksum, unit byte; simulator_state, type enum+ledger, unit 1; scenario_trace, type table, unit s, 1. The collection, qualification, validation and preservation flow is planned, not executed.</desc><rect x="0" y="0" width="1040" height="1456" rx="18" fill="#f7f8f5"/><rect x="0" y="0" width="1040" height="12" rx="6" fill="#1d676d"/><text x="38" y="49" fill="#206870" font-size="13" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.4">I07 / DATA DEFINITION ATLAS</text><text x="1000" y="49" fill="#206870" font-size="13" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="end" letter-spacing="1.4">08 FIELDS</text><text x="38" y="98" fill="#16324a" font-size="29" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start">GATEWAY CATSAT CONSOLE</text><text x="38" y="132" fill="#80542f" font-size="15" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="0.7">PROPOSED DATA CONTRACT</text><text x="38" y="160" fill="#52687b" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">No project observations acquired · acquisition template contains headers only</text><text x="38" y="188" fill="#52687b" font-size="15" font-weight="400" font-family="Arial