<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1456" viewBox="0 0 1040 1456" role="img" aria-labelledby="title description"><title id="title">I06 proposed data contract — 8 defined fields</title><desc id="description">Proposed data contract for I06, SATURN LOADPATH. No project observations have been acquired. Every dictionary field is shown with its type and unit: cad_mesh_revision, type struct&lt;string&gt;, unit 1; material_properties, type measurement&lt;struct&gt;, unit Pa, kg m^-3; joint_model, type distribution&lt;struct&gt;, unit N m^-1, N m rad^-1; load_constraint, type struct, unit N, N m, m; imperfection_field, type distribution&lt;array&gt;, unit m; response, type measurement&lt;struct&gt;, unit m, strain, Hz; similarity_ledger, type table, unit 1; pareto_design, type table, unit kg, m N^-1, 1. The collection, qualification, validation and preservation flow is planned, not executed.</desc><rect x="0" y="0" width="1040" height="1456" rx="18" fill="#f7f8f5"/><rect x="0" y="0" width="1040" height="12" rx="6" fill="#1d676d"/><text x="38" y="49" fill="#206870" font-size="13" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.4">I06 / DATA DEFINITION ATLAS</text><text x="1000" y="49" fill="#206870" font-size="13" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="end" letter-spacing="1.4">08 FIELDS</text><text x="38" y="98" fill="#16324a" font-size="29" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start">SATURN LOADPATH</text><text x="38" y="132" fill="#80542f" font-size="15" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="0.7">PROPOSED DATA CONTRACT</text><text x="38" y="160" fill="#52687b" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">No project observations acquired · acquisition template contains headers only</text><text x="38" y="188" fill="#52687