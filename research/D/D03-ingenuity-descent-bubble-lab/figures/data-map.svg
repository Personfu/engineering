#16324a" font-size="19" font-weight="700" font-family="Consolas, Menlo, monospace" text-anchor="start">transfer_envelope</text><text x="560" y="1084" fill="#52687b" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.2">TYPE</text><text x="560" y="1108" fill="#174f5c" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">nullable&lt;record&gt;</text><text x="560" y="1135" fill="#52687b" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.2">UNIT</text><text x="560" y="1159" fill="#16324a" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">N,N m</text><text x="560" y="1188" fill="#52687b" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Compatible force/torque perturbation model.</text><text x="38" y="1258" fill="#206870" font-size="12" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.5">THE RECORD ENVELOPE</text><rect x="38" y="1278" width="214" height="92" rx="12" fill="#edf2f1"/><text x="56" y="1302" fill="#48787d" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start">01</text><text x="56" y="1326" fill="#16324a" font-size="17" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start">COLLECT</text><text x="56" y="1349" fill="#52687b" font-size="13" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Future acquisition</text><line x1="257" y1="1323" x2="280" y2="1323" stroke="#61948b" stroke-width="1.5"/><path d="M273 1318 L280 1323 L273 1328" fill="none" stroke="#61948b" stroke-width="1.5"/><rect x="288" y="1278" width="214" height="92" rx="12" fill="#edf2f1"/><text x="306" y="1302" fill="#48787d" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start">02</text><text x="306" y="1326" fill="#16324a" font-size="17" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start">QUALIFY</text><text x="306" y="1349" fill="#52687b" font-size="13" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Frame + calibration</text><line x1="507" y1="1323" x2="530" y2="1323" stroke="#61948b" stroke-width="1.5"/><path d="M523 1318 L530 1323 L523 1328" fill="none" stroke="#61948b" stroke-width="1.5"/><rect x="538" y="1278" width="214" height="92" rx="12" fill="#edf2f1"/><text x="556" y="1302" fill="#48787d" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start">03</text><text x="556" y="1326" fill="#16324a" font-size="17" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start">VALIDATE</text><text x="556" y="1349" fill="#52687b" font-size="13" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Shape + domain rules</text><line x1="757" y1="1323" x2="780" y2="1323" stroke="#61948b" stroke-width="1.5"/><path d="M773 1318 L780 1323 L773 1328" fill="none" stroke="#61948b" stroke-width="1.5"/><rect x="788" y="1278" width="214" height="92" rx="12" fill="#0d2a43"/><text x="806" y="1302" fill="#65d8c0" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start">04</text><text x="806" y="1326" fill="#ffffff" font-size="17" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start">PRESERVE</text><text x="806" y="1349" fill="#c4d6df" font-size="13" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Version + provenance</text><text x="38" y="1404" fill="#52687b" font-size="15" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Missing values stay unknown; zero is never a substitute for an absent measurement.</text><text x="38" y="1432" fill="#52687b" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">A schema checks structure. Physical bounds, covariance, units and calibration still require domain checks.</text><line x1="38" y1="1450" x2="1002" y2="1450" stroke="#dce5e7" stroke-width="1"/><text x="38" y="1476" fill="#627b88" font-size="11" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">ATLAS / SESSION D / D03 · Source: engineering_annexes.json</text><text x="1002" y="1476" fill="#80542f" font-size="11" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="end">SCHEMATIC · NO EXPERIMENTAL RESULTS</text></svg>
