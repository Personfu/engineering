<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1496" viewBox="0 0 1040 1496" role="img" aria-labelledby="title description"><title id="title">D03 proposed data contract — 8 defined fields</title><desc id="description">Proposed data contract for D03, INGENUITY DESCENT &amp; BUBBLE LAB. No project observations have been acquired. Every dictionary field is shown with its type and unit: package_id, type enum, unit 1; atmosphere, type record, unit kg/m^3,Pa s,m/s^2; rotor_geometry, type array&lt;radius,chord&gt;, unit m; aero_coefficients, type float64[state,2], unit 1; descent_state, type pair&lt;float64&gt;, unit m/s,rad/s; bubble_length, type nullable&lt;float64&gt;, unit m; pressure_velocity_trace, type nullable&lt;record&gt;, unit Pa,m/s; transfer_envelope, type nullable&lt;record&gt;, unit N,N m. The collection, qualification, validation and preservation flow is planned, not executed.</desc><rect x="0" y="0" width="1040" height="1496" rx="18" fill="#f7f8f5"/><rect x="0" y="0" width="1040" height="12" rx="6" fill="#1d676d"/><text x="38" y="49" fill="#206870" font-size="13" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.4">D03 / DATA DEFINITION ATLAS</text><text x="1000" y="49" fill="#206870" font-size="13" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="end" letter-spacing="1.4">08 FIELDS</text><text x="38" y="98" fill="#16324a" font-size="29" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start">INGENUITY DESCENT &amp; BUBBLE LAB</text><text x="38" y="132" fill="#80542f" font-size="15" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="0.7">PROPOSED DATA CONTRACT</text><text x="38" y="160" fill="#52687b" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">No project observations acquired · acquisition template contains headers only</text><text x="38" y="188" fill="#52687b" font-size="15" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Field names, types and units below come directly from the versioned engineering dictionary.</text><line x1="38" y1="211" x2="1002" y2="211" stroke="#dce5e7" stroke-width="1"/><rect x="38" y="250" width="464" height="216" rx="14" fill="#ffffff" stroke="#dce5e7"/><rect x="38" y="268" width="4" height="180" rx="2" fill="#277f79"/><text x="60" y="278" fill="#477478" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.3">01 / FIELD DEFINITION</text><text x="60" y="306" fill="#16324a" font-size="19" font-weight="700" font-family="Consolas, Menlo, monospace" text-anchor="start">package_id</text><text x="60" y="336" fill="#52687b" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.2">TYPE</text><text x="60" y="360" fill="#174f5c" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">enum</text><text x="60" y="387" fill="#52687b" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.2">UNIT</text><text x="60" y="411" fill="#16324a" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">1</text><text x="60" y="440" fill="#52687b" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">D03a or D03b origin.</text><rect x="538" y="250" width="464" height="216" rx="14" fill="#ffffff" stroke="#dce5e7"/><rect x="538" y="268" width="4" height="180" rx="2" fill="#277f79"/><text x="560" y="278" fill="#477478" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.3">02 / FIELD DEFINITION</text><text x="560" y="306" fill="#16324a" font-size="19" font-weight="700" font-family="Consolas, Menlo, monospace" text-anchor="start">atmosphere</text><text x="560" y="336" fill="#52687b" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.2">TYPE</text><text x="560" y="360" fill="#174f5c" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">record</text><text x="560" y="387" fill="#52687b" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.2">UNIT</text><text x="560" y="411" fill="#16324a" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">kg/m^3,Pa s,m/s^2</text><text x="560" y="440" fill="#52687b" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Density, viscosity and gravity.</text><rect x="38" y="486" width="464" height="256" rx="14" fill="#ffffff" stroke="#dce5e7"/><rect x="38" y="504" width="4" height="220" rx="2" fill="#277f79"/><text x="60" y="514" fill="#477478" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.3">03 / FIELD DEFINITION</text><text x="60" y="542" fill="#16324a" font-size="19" font-weight="700" font-family="Consolas, Menlo, monospace" text-anchor="start">rotor_geometry</text><text x="60" y="572" fill="#52687b" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.2">TYPE</text><text x="60" y="596" fill="#174f5c" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">array&lt;radius,chord&gt;</text><text x="60" y="623" fill="#52687b" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.2">UNIT</text><text x="60" y="647" fill="#16324a" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">m</text><text x="60" y="676" fill="#52687b" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Blade discretization.</text><rect x="538" y="486" width="464" height="256" rx="14" fill="#ffffff" stroke="#dce5e7"/><rect x="538" y="504" width="4" height="220" rx="2" fill="#277f79"/><text x="560" y="514" fill="#477478" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.3">04 / FIELD DEFINITION</text><text x="560" y="542" fill="#16324a" font-size="19" font-weight="700" font-family="Consolas, Menlo, monospace" text-anchor="start">aero_coefficients</text><text x="560" y="572" fill="#52687b" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.2">TYPE</text><text x="560" y="596" fill="#174f5c" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">float64[state,2]</text><text x="560" y="623" fill="#52687b" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.2">UNIT</text><text x="560" y="647" fill="#16324a" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">1</text><text x="560" y="676" fill="#52687b" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Coefficient rows align to a versioned</text><text x="560" y="696" fill="#52687b" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">local-flow-state index; columns are exactly</text><text x="560" y="716" fill="#52687b" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">[C_L,C_D].</text><rect x="38" y="762" width="464" height="216" rx="14" fill="#ffffff" stroke="#dce5e7"/><rect x="38" y="780" width="4" height="180" rx="2" fill="#277f79"/><text x="60" y="790" fill="#477478" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif"