67" x2="780" y2="1067" stroke="#61948b" stroke-width="1.5"/><path d="M773 1062 L780 1067 L773 1072" fill="none" stroke="#61948b" stroke-width="1.5"/><rect x="788" y="1022" width="214" height="92" rx="12" fill="#0d2a43"/><text x="806" y="1046" fill="#65d8c0" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start">04</text><text x="806" y="1070" fill="#ffffff" font-size="17" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start">PRESERVE</text><text x="806" y="1093" fill="#c4d6df" font-size="13" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Version + provenance</text><text x="38" y="1148" fill="#52687b" font-size="15" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Missing values stay unknown; zero is never a substitute for an absent measurement.</text><text x="38" y="1176" fill="#52687b" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">A schema checks structure. Physical bounds, covariance, units and calibration still require domain checks.</text><line x1="38" y1="1194" x2="1002" y2="1194" stroke="#dce5e7" stroke-width="1"/><text x="38" y="1220" fill="#627b88" font-size="11" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">ATLAS / SESSION C / C01 · Source: engineering_annexes.json</text><text x="1002" y="1220" fill="#80542f" font-size="11" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="end">SCHEMATIC · NO EXPERIMENTAL RESULTS</text></svg>
