<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1476" viewBox="0 0 1040 1476" role="img" aria-labelledby="title description"><title id="title">C28 proposed data contract — 8 defined fields</title><desc id="description">Proposed data contract for C28, LOWELL LUNAR LANTERN. No project observations have been acquired. Every dictionary field is shown with its type and unit: equipment_id, type struct, unit m^2, detector units; standard_spectrum, type array+reference, unit W m^-2 m^-1; system_throughput, type float64[nlambda], unit 1; airmass_atmosphere, type struct, unit 1; net_electrons, type measurement&lt;float64&gt;, unit electron; calibration_coefficients, type posterior&lt;float64[]&gt;, unit mag, mag airmass^-1; aperture_response, type measurement&lt;float64&gt;, unit 1; line_flux, type measurement&lt;float64&gt;|null, unit erg s^-1 cm^-2. The collection, qualification, validation and preservation flow is planned, not executed.</desc><rect x="0" y="0" width="1040" height="1476" rx="18" fill="#f7f8f5"/><rect x="0" y="0" width="1040" height="12" rx="6" fill="#1d676d"/><text x="38" y="49" fill="#206870" font-size="13" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.4">C28 / DATA DEFINITION ATLAS</text><text x="1000" y="49" fill="#206870" font-size="13" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="end" letter-spacing="1.4">08 FIELDS</text><text x="38" y="98" fill="#16324a" font-size="29" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start">LOWELL LUNAR LANTERN</text><text x="38" y="132" fill="#80542f" font-size="15" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="0.7">PROPOSED DATA CONTRACT</text><text x="38" y="160" fill="#52687b" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">No project observations acquired · acquisition template contains headers onl