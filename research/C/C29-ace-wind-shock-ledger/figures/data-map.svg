ance, units and calibration still require domain checks.</text><line x1="38" y1="1410" x2="1002" y2="1410" stroke="#dce5e7" stroke-width="1"/><text x="38" y="1436" fill="#627b88" font-size="11" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">ATLAS / SESSION C / C29 · Source: engineering_annexes.json</text><text x="1002" y="1436" fill="#80542f" font-size="11" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="end">SCHEMATIC · NO EXPERIMENTAL RESULTS</text></svg>
