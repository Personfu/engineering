<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1456" viewBox="0 0 1040 1456" role="img" aria-labelledby="title description"><title id="title">C29 proposed data contract — 8 defined fields</title><desc id="description">Proposed data contract for C29, ACE WIND SHOCK LEDGER. No project observations have been acquired. Every dictionary field is shown with its type and unit: event_epoch, type float64, unit CDF-declared time; plasma_state, type measurement&lt;struct&gt;, unit kg m^-3, m s^-1, Pa; magnetic_vector, type measurement&lt;float64[3]&gt;, unit T; proton_intensity, type measurement&lt;float64[nE,nangle]&gt;, unit m^-2 s^-1 sr^-1 J^-1; shock_geometry, type posterior&lt;struct&gt;, unit 1, m s^-1; particle_budget, type posterior&lt;float64[2]&gt;, unit Pa, J m^-3; energy_flux, type posterior&lt;float64[terms]&gt;, unit W m^-2; band_fraction, type posterior&lt;float64&gt;|null, unit 1. The collection, qualification, validation and preservation flow is planned, not executed.</desc><rect x="0" y="0" width="1040" height="1456" rx="18" fill="#f7f8f5"/><rect x="0" y="0" width="1040" height="12" rx="6" fill="#1d676d"/><text x="38" y="49" fill="#206870" font-size="13" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.4">C29 / DATA DEFINITION ATLAS</text><text x="1000" y="49" fill="#206870" font-size="13" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="end" letter-spacing="1.4">08 FIELDS</text><text x="38" y="98" fill="#16324a" font-size="29" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start">ACE WIND SHOCK LEDGER</text><text x="38" y="132" fill="#80542f" font-size="15" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="0.7">PROPOSED DATA CONTRACT</text><text x="38" y="160" fill="#52687b" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">No project observations acquired · acquisition template contains headers only</text><text x="38" y="188" fill="#52687b" font-size="15" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Field names, types and units below come directly from the versioned engineering dictionary.</text><line x1="38" y1="211" x2="1002" y2="211" stroke="#dce5e7" stroke-width="1"/><rect x="38" y="250" width="464" height="216" rx="14" fill="#ffffff" stroke="#dce5e7"/><rect x="38" y="268" width="4" height="180" rx="2" fill="#277f79"/><text x="60" y="278" fill="#477478" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.3">01 / FIELD DEFINITION</text><text x="60" y="306" fill="#16324a" font-size="19" font-weight="700" font-family="Consolas, Menlo, monospace" text-anchor="start">event_epoch</text><text x="60" y="336" fill="#52687b" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.2">TYPE</text><text x="60" y="360" fill="#174f5c" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">float64</text><text x="60" y="387" fill="#52687b" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.2">UNIT</text><text x="60" y="411" fill="#16324a" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">CDF-declared time</text><text x="60" y="440" fill="#52687b" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Shock candidate and window boundaries.</text><rect x="538" y="250" width="464" height="216" rx="14" fill="#ffffff" stroke="#dce5e7"/><rect x="538" y="268" width="4" height="180" rx="2" fill="#277f79"/><text x="560" y="278" fill="#477478" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" letter-spacing="1.3">02 / FIELD DEFINITION</text><text x="5