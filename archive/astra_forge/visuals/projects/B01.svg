<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">TERRA CALDERA PULSE research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / B01 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">TERRA CALDERA PULSE</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Does geochemistry add explanatory power beyond seasonality and sampling</tspan><tspan x="28" dy="22">changes?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">USGS spring chemistry, GNSS deformation, temperature,</tspan><tspan x="46" dy="19">precipitation, sampling method and detection limits.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">y_t=beta0+beta1*deformation_(t-lag)+season(t)+site</tspan><tspan x="506" dy="19">effect+AR residual; explore physically justified lag</tspan><tspan x="506" dy="19">windows, not arbitrary correlation fishing.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Use blocked time validation, station holdouts and</tspan><tspan x="46" dy="19">multiple-lag correction; missing samples are not zero</tspan><tspan x="46" dy="19">concentrations; association is not eruption</tspan><tspan x="46" dy="19">prediction.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Synchronized deformation and chemistry, lag-response</tspan><tspan x="506" dy="19">uncertainty, site map.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>