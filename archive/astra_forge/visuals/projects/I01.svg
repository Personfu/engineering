<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">APOLLO SHUTDOWN DURABILITY research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / I01 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">APOLLO SHUTDOWN DURABILITY</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">What published transient evidence links shutdown conditions to</tspan><tspan x="28" dy="22">thermal/material damage?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Published shutdown time series, thermal measurements,</tspan><tspan x="46" dy="19">inspection results and material properties; no engine</tspan><tspan x="46" dy="19">control sequence or firing instructions.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Equivalence ratio phi=(fuel/oxidizer)/(stoichiometric</tspan><tspan x="506" dy="19">fuel/oxidizer); retrospective damage proxy integrates</tspan><tspan x="506" dy="19">temperature/stress exposure, with chemistry and</tspan><tspan x="506" dy="19">fatigue models requiring validated material data.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Compare multiple shutdown histories, thermal cycles</tspan><tspan x="46" dy="19">and inspection evidence; correlation does not</tspan><tspan x="46" dy="19">establish a safe shutdown procedure.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Transient thermal ledger, material evidence map,</tspan><tspan x="506" dy="19">damage-model sensitivity.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>