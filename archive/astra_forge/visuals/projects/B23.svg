<title id="t">AQUA WATERSHED DECISIONS research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / B23 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">AQUA WATERSHED DECISIONS</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Which water-management decisions remain robust across plausible</tspan><tspan x="28" dy="22">hydrologic models?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">USGS discharge, precipitation, watershed area, soils,</tspan><tspan x="46" dy="19">management objectives and forecast issue time.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Catchment storage dS/dt=P-ET-Q; event routing and</tspan><tspan x="506" dy="19">infiltration are explicit modules; evaluate decisions</tspan><tspan x="506" dy="19">by regret across rainfall and parameter ensembles.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Nash-Sutcliffe efficiency plus bias, peak timing and</tspan><tspan x="46" dy="19">volume closure; split wet/dry years; assess decisions</tspan><tspan x="46" dy="19">separately from fit quality.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Hydrograph ensemble, water budget, decision-regret</tspan><tspan x="506" dy="19">frontier.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>