<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">ORION BONE LOAD OBSERVATORY research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / G01 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">ORION BONE LOAD OBSERVATORY</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Which sensor combinations resolve strain while controlling calibration</tspan><tspan x="28" dy="22">and placement uncertainty?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Published ex-vivo measurements or authorized</tspan><tspan x="46" dy="19">deidentified test data, sensor orientation, load,</tspan><tspan x="46" dy="19">calibration and specimen metadata.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">epsilon=DeltaL/L; linear reference sigma=E*epsilon;</tspan><tspan x="506" dy="19">multi-sensor y=H*strain_state+noise with conditioning</tspan><tspan x="506" dy="19">and temperature effects.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Independent load-cell comparison, repeated calibration</tspan><tspan x="46" dy="19">and cross-talk checks; ex-vivo performance is not</tspan><tspan x="46" dy="19">clinical efficacy.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Strain rosette, sensor residuals, observable-mode</tspan><tspan x="506" dy="19">diagram.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>