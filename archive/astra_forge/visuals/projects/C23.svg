<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">KEPLER METALLICITY CENSUS research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / C23 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">KEPLER METALLICITY CENSUS</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">How does planet occurrence vary with metallicity after accounting for</tspan><tspan x="28" dy="22">survey completeness?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Exoplanet Archive plus survey target stars,</tspan><tspan x="46" dy="19">metallicity calibration, injection-recovery</tspan><tspan x="46" dy="19">completeness and searchable period/radius domain.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Detected counts~Poisson(Nstars*occurrence([Fe/H],P,R)*</tspan><tspan x="506" dy="19">completeness); planet-host metallicity distributions</tspan><tspan x="506" dy="19">alone cannot estimate occurrence without target</tspan><tspan x="506" dy="19">denominators.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Host-group splits, selection-function checks and</tspan><tspan x="46" dy="19">measurement-error models; compare giant and small-</tspan><tspan x="46" dy="19">planet regimes separately.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Occurrence-metallicity bands, target/detection</tspan><tspan x="506" dy="19">distributions, completeness map.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>