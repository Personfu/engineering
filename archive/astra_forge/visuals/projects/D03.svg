<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">DRAGONFLY AUTOROTOR research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / D03 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">DRAGONFLY AUTOROTOR</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Which geometry tradeoffs reduce descent speed without sacrificing</tspan><tspan x="28" dy="22">sensing or stability?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Published descent studies, mass, geometry, air density</tspan><tspan x="46" dy="19">and attitude measurements; synthetic trajectories for</tspan><tspan x="46" dy="19">reference only.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Vertical force m*dv/dt=m*g-0.5*rho*CD*A*v^2;</tspan><tspan x="506" dy="19">rotational I*domega/dt=torque_aero-torque_loss;</tspan><tspan x="506" dy="19">coupled autorotation requires validated aerodynamic</tspan><tspan x="506" dy="19">coefficients.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Terminal-speed limit, dimensional consistency and</tspan><tspan x="46" dy="19">independent descent data; Earth coefficients do not</tspan><tspan x="46" dy="19">transfer directly to Mars.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Descent trajectory, rotor schematic, stability-versus-</tspan><tspan x="506" dy="19">payload Pareto frontier.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>