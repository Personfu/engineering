<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">LIGO OPTICAL SERVO research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / C14 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">LIGO OPTICAL SERVO</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Can an optical-control model maintain lock under measurement noise and</tspan><tspan x="28" dy="22">actuator limits?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Published optical-control transfer functions,</tspan><tspan x="46" dy="19">laboratory calibration and authorized controller logs;</tspan><tspan x="46" dy="19">no powered laser experiment instructions.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Closed-loop response T=L/(1+L); L=C*P; linearized</tspan><tspan x="506" dy="19">cavity response plus sensor noise and saturation;</tspan><tspan x="506" dy="19">project-specific hardware definition requires primary</tspan><tspan x="506" dy="19">presentation.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Gain/phase margins, disturbance rejection, lock-loss</tspan><tspan x="46" dy="19">recovery in simulation and nonlinear saturation</tspan><tspan x="46" dy="19">checks.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Bode plot, cavity/servo schematic, lock-error</tspan><tspan x="506" dy="19">timeline.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>