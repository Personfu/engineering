<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">ASCEND HELIX VAULT research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / E02 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">ASCEND HELIX VAULT</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">How can a balloon payload preserve environmental context and sample-</tspan><tspan x="28" dy="22">study provenance?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">2021 source records define historical scope; geometry,</tspan><tspan x="46" dy="19">inert sample placeholders, sensor metadata and</tspan><tspan x="46" dy="19">authorized flight logs; no biological exposure</tspan><tspan x="46" dy="19">protocol.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Rigid-body attitude and time-aligned environmental</tspan><tspan x="506" dy="19">records; payload compartment geometry plus thermal</tspan><tspan x="506" dy="19">network; biological interpretation remains a</tspan><tspan x="506" dy="19">published-evidence review.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Time synchronization, missing-sensor behavior,</tspan><tspan x="46" dy="19">geometry/center-of-mass review and independent</tspan><tspan x="46" dy="19">environmental calibration.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Exploded payload shell, sensor bus diagram,</tspan><tspan x="506" dy="19">altitude/attitude replay.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>