<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">APOLLO SPECTRAL BENCH research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / G07 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">APOLLO SPECTRAL BENCH</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Which mount design meets alignment, stability and maintainability</tspan><tspan x="28" dy="22">requirements with verifiable margins?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Authorized instrument dimensions, interface</tspan><tspan x="46" dy="19">requirements, material properties,</tspan><tspan x="46" dy="19">alignment/calibration data and requirements versions.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Grating m*lambda=d*(sin(alpha)+sin(beta)); mount</tspan><tspan x="506" dy="19">tolerance propagation</tspan><tspan x="506" dy="19">sigma_lambda^2=J*Cov(angles)*J^T; structural and</tspan><tspan x="506" dy="19">thermal errors tracked separately.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Tolerance stack, static deflection and thermal</tspan><tspan x="46" dy="19">expansion checks; independent calibration; educational</tspan><tspan x="46" dy="19">CAD is not production-ready hardware.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Mount exploded view, optical path, alignment</tspan><tspan x="506" dy="19">sensitivity budget.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>