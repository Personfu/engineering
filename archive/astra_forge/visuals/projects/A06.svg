<title id="t">ORION P66 STRUCTURE ATLAS research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / A06 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">ORION P66 STRUCTURE ATLAS</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">What published structural evidence supports or limits interpretations of</tspan><tspan x="28" dy="22">P66?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Published P66 sequence accessions and public</tspan><tspan x="46" dy="19">structures; historical research citation; no organism</tspan><tspan x="46" dy="19">handling, expression optimization or purification</tspan><tspan x="46" dy="19">protocol.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Evidence-only sequence/structure comparison:</tspan><tspan x="506" dy="19">identity=matched residues/aligned residues; annotate</tspan><tspan x="506" dy="19">topology, confidence and unresolved regions. Do not</tspan><tspan x="506" dy="19">infer purification success from a predicted structure.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Verify organism, accession version and alignment</tspan><tspan x="46" dy="19">coverage; separate experimentally resolved from</tspan><tspan x="46" dy="19">predicted features; audit conflicting annotations.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Annotated topology schematic, sequence-domain map,</tspan><tspan x="506" dy="19">structure-confidence panel.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>