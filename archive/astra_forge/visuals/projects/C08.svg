<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">PERSEVERANCE MINERAL MIX research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / C08 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">PERSEVERANCE MINERAL MIX</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">When can spectra distinguish abundance from grain size and mixing</tspan><tspan x="28" dy="22">geometry?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">USGS reference spectra and PDS rover/orbiter products,</tspan><tspan x="46" dy="19">wavelength microns, grain size, incidence/emission and</tspan><tspan x="46" dy="19">calibration.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Areal reference R_mix=sum(f_i*R_i); intimate mixtures</tspan><tspan x="506" dy="19">need radiative transfer; band</tspan><tspan x="506" dy="19">depth=1-Rband/Rcontinuum; abundance constraints</tspan><tspan x="506" dy="19">require grain-size and geometry priors.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Independent bands, withheld mixtures and alternative</tspan><tspan x="46" dy="19">minerals; linear mixture only an educational baseline.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Spectral endmembers, abundance-grain degeneracy, band-</tspan><tspan x="506" dy="19">depth maps.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>