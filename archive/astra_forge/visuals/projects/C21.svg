<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">PARKER FIELD REVERSALS research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / C21 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">PARKER FIELD REVERSALS</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Which field rotations are robust to cadence, gaps and reference-field</tspan><tspan x="28" dy="22">choice?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">CDAWeb Parker magnetic/velocity products, UTC, nT,</tspan><tspan x="46" dy="19">km/s, spacecraft position, cadence and quality flags.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">theta=acos(B dot B_ref/(abs(B)*abs(B_ref))); classify</tspan><tspan x="506" dy="19">sustained angular excursions alongside velocity and</tspan><tspan x="506" dy="19">magnitude; reference field and duration threshold</tspan><tspan x="506" dy="19">declared.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Gap-aware event boundaries, threshold sensitivity and</tspan><tspan x="46" dy="19">independently reviewed intervals; field reversal alone</tspan><tspan x="46" dy="19">does not uniquely establish origin.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Field-vector rotation, event timeline, radial context</tspan><tspan x="506" dy="19">and boundary uncertainty.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>