<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">VOYAGER QUIET CHANNEL research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / G02 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">VOYAGER QUIET CHANNEL</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Can reference-channel filtering remove interference without erasing the</tspan><tspan x="28" dy="22">desired signal?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Synthetic desired/reference/interference signals or</tspan><tspan x="46" dy="19">authorized recordings, sample rate, clock alignment</tspan><tspan x="46" dy="19">and gain metadata.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">NLMS w_next=w+mu*e*x/(epsilon+x dot x); e=d-w dot x;</tspan><tspan x="506" dy="19">reference must correlate with interference and remain</tspan><tspan x="506" dy="19">independent of desired signal.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Measure signal distortion as well as residual noise;</tspan><tspan x="46" dy="19">test desired-signal leakage into reference and</tspan><tspan x="46" dy="19">convergence under nonstationary interference.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Before/after spectra, learning curve, desired-signal</tspan><tspan x="506" dy="19">fidelity.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>