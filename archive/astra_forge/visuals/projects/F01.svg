<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">VOYAGER MISSION VOICES research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / F01 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">VOYAGER MISSION VOICES</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Which communication designs improve understanding while preserving</tspan><tspan x="28" dy="22">scientific uncertainty?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Consented anonymous feedback, accessibility</tspan><tspan x="46" dy="19">evaluation, published education studies and claim-</tspan><tspan x="46" dy="19">source mapping.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Pre/post understanding measured with validated</tspan><tspan x="506" dy="19">questions; effect=change_intervention-</tspan><tspan x="506" dy="19">change_comparison; qualitative themes are coded with</tspan><tspan x="506" dy="19">disagreement recorded.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Avoid leading survey questions, self-selection claims</tspan><tspan x="46" dy="19">and engagement-as-learning substitution; preregister</tspan><tspan x="46" dy="19">evaluation before audience testing.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Audience journey, comprehension change intervals,</tspan><tspan x="506" dy="19">accessibility/claim matrix.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>