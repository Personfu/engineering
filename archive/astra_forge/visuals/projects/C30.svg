<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">WEBB COSMIC SEEDS research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / C30 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">WEBB COSMIC SEEDS</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Which observations distinguish seed scenarios after accounting for</tspan><tspan x="28" dy="22">growth and selection?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Published high-redshift candidates, spectra, redshift</tspan><tspan x="46" dy="19">confidence, mass-estimator uncertainty and selection</tspan><tspan x="46" dy="19">functions.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">dM/dt=(1-epsilon)*L/(epsilon*c^2); compare seed mass,</tspan><tspan x="506" dy="19">duty cycle, Eddington ratio and merger histories using</tspan><tspan x="506" dy="19">selection-aware population likelihoods.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Alternative stellar/AGN interpretations, luminosity</tspan><tspan x="46" dy="19">completeness and prior sensitivity; a rapid-growth toy</tspan><tspan x="46" dy="19">curve is not a seed detection.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Seed-growth trajectories, observed selection window,</tspan><tspan x="506" dy="19">scenario evidence matrix.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>