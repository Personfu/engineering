<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">ARTEMIS TRANSFER COMPASS research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / I12 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">ARTEMIS TRANSFER COMPASS</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Can heuristic searches improve conceptual transfer tradeoffs without</tspan><tspan x="28" dy="22">hiding constraint violations?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Published Earth-Moon constants, coordinate frames,</tspan><tspan x="46" dy="19">boundary states and reference trajectory studies; no</tspan><tspan x="46" dy="19">operational guidance or spacecraft commanding.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">CR3BP rotating-frame equations plus impulsive</tspan><tspan x="506" dy="19">maneuvers; objective deltaV=sum(abs(delta_v_i)) with</tspan><tspan x="506" dy="19">explicit time, clearance and endpoint constraints;</tspan><tspan x="506" dy="19">compare simple baseline solutions.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Constraint residuals, Jacobi invariant between</tspan><tspan x="46" dy="19">impulses, multiple seeds and integrator convergence;</tspan><tspan x="46" dy="19">two-body demos are not DRO transfer solutions.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Conceptual rotating-frame trajectories,</tspan><tspan x="506" dy="19">objective/constraint frontier, convergence by seed.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>