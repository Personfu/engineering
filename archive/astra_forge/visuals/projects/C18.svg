<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">HUBBLE IONIZING FRONTIERS research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / C18 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">HUBBLE IONIZING FRONTIERS</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">When do emission-line ratios support rather than overstate ionizing-</tspan><tspan x="28" dy="22">photon escape?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">MAST spectra/imaging, redshift, line-flux covariance,</tspan><tspan x="46" dy="19">nondetections and foreground classifications.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">O32=F([OIII])/F([OII]); include dust, excitation and</tspan><tspan x="506" dy="19">aperture effects; escape fraction requires LyC</tspan><tspan x="506" dy="19">measurement, foreground rejection and intergalactic-</tspan><tspan x="506" dy="19">transmission model.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Independent line extraction and matched apertures;</tspan><tspan x="46" dy="19">censored likelihoods; high O32 alone is not proof of</tspan><tspan x="46" dy="19">LyC leakage.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Line-ratio plane, LyC evidence receipts, foreground</tspan><tspan x="506" dy="19">contamination map.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>