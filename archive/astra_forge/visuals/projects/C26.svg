<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">LIGO QUIET PENDULUM research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / C26 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">LIGO QUIET PENDULUM</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Which suspension modes dominate low-frequency motion transmission?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Published suspension geometry, masses, resonances,</tspan><tspan x="46" dy="19">vibration spectra and instrument calibration;</tspan><tspan x="46" dy="19">educational inert model.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Base-excited oscillator</tspan><tspan x="506" dy="19">H(omega)=(k+i*c*omega)/(k-m*omega^2+i*c*omega);</tspan><tspan x="506" dy="19">multistage extension uses mass/damping/stiffness</tspan><tspan x="506" dy="19">matrices.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Recover f0=sqrt(k/m)/(2*pi), compare modal fits and</tspan><tspan x="46" dy="19">check vibration-isolation asymptotes.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Suspension schematic, transmissibility curve, mode</tspan><tspan x="506" dy="19">shapes and noise budget.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>