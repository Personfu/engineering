<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">XPLANE SPHERE BENCHMARK research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / D05 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">XPLANE SPHERE BENCHMARK</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Does numerical drag converge to appropriate reference behavior across</tspan><tspan x="28" dy="22">Reynolds regimes?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Published sphere benchmarks, domain size, mesh, solver</tspan><tspan x="46" dy="19">tolerances, boundary conditions and drag history.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Re=rho*U*D/mu; CD=Fd/(0.5*rho*U^2*A); creeping-flow</tspan><tspan x="506" dy="19">CD=24/Re; integrate pressure and viscous forces</tspan><tspan x="506" dy="19">separately.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Stokes limit, mass conservation, grid/time convergence</tspan><tspan x="46" dy="19">and domain-size study; empirical correlations are not</tspan><tspan x="46" dy="19">the new CFD solver.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Drag-Re curve, convergence plot, wake schematic and</tspan><tspan x="506" dy="19">force budget.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>