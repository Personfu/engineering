<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">APOLLO EVIDENCE EDITOR research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / F02 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">APOLLO EVIDENCE EDITOR</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">How does a science narrative retain accuracy while improving reader</tspan><tspan x="28" dy="22">comprehension?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Primary-source research, editorial versions, consented</tspan><tspan x="46" dy="19">reader feedback and accessibility checks; original</tspan><tspan x="46" dy="19">authors retain credit.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Claim ledger assigns every material statement a</tspan><tspan x="506" dy="19">source, date, evidence class and uncertainty;</tspan><tspan x="506" dy="19">readability scores support editing but do not measure</tspan><tspan x="506" dy="19">scientific accuracy.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Blind factual review, source-date audit and</tspan><tspan x="46" dy="19">comprehension testing; distinguish quotation,</tspan><tspan x="46" dy="19">paraphrase and original interpretation.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Claim-to-source graph, revision comparison,</tspan><tspan x="506" dy="19">comprehension uncertainty.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>