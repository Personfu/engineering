<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">XPLANE VORTEX LAB research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / D01 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">XPLANE VORTEX LAB</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Which activation choices change separation while accounting for actuator</tspan><tspan x="28" dy="22">energy?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Published wind-tunnel force data, Reynolds number,</tspan><tspan x="46" dy="19">geometry, actuation state, uncertainty and</tspan><tspan x="46" dy="19">synchronized flow images.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">CL=L/(0.5*rho*U^2*S), CD=D/(0.5*rho*U^2*S); unsteady</tspan><tspan x="506" dy="19">Navier-Stokes plus controlled boundary condition;</tspan><tspan x="506" dy="19">compare incremental lift/drag and net power.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Baseline repeats, balance calibration and matched</tspan><tspan x="46" dy="19">Reynolds number; actuation benefit must include</tspan><tspan x="46" dy="19">actuator power.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Separation overlay, lift/drag polar, flow-control</tspan><tspan x="506" dy="19">energy tradeoff.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>