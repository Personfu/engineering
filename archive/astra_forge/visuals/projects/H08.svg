<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">STARDUST RIM CHRONICLE research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / H08 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">STARDUST RIM CHRONICLE</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Which microstructural observations discriminate competing rim-formation</tspan><tspan x="28" dy="22">histories?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Published electron microscopy, mineral maps, sample</tspan><tspan x="46" dy="19">preparation metadata, particle boundaries and</tspan><tspan x="46" dy="19">analytical resolution.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Grain-size distributions and rim thickness measured</tspan><tspan x="506" dy="19">with resolution correction; compare accretion,</tspan><tspan x="506" dy="19">compaction and alteration scenarios using explicit</tspan><tspan x="506" dy="19">evidence likelihoods.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Independent annotations, segmentation sensitivity and</tspan><tspan x="46" dy="19">stereological bias; one 2D section cannot uniquely</tspan><tspan x="46" dy="19">reconstruct a 3D growth history.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Annotated rim cross-section, size distributions,</tspan><tspan x="506" dy="19">competing-origin evidence map.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>