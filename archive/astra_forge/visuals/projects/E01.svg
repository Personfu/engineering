<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">ASCEND PHOENIX SKYLINK research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / E01 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">ASCEND PHOENIX SKYLINK</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">How can video, sensor and published DNA-study evidence share an</tspan><tspan x="28" dy="22">auditable mission timeline?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">2021 symposium project provenance; Drive Spring 2025</tspan><tspan x="46" dy="19">deck provides later payload context, not DNA results</tspan><tspan x="46" dy="19">or raw telemetry; authorized logs/footage needed.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Video time=t0+frame_index/fps with drift correction;</tspan><tspan x="506" dy="19">packet delivery ratio=valid_received/sent; biological</tspan><tspan x="506" dy="19">branch uses published evidence only and separate</tspan><tspan x="506" dy="19">controls.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Clock-offset checks, dropped-frame accounting and</tspan><tspan x="46" dy="19">sensor fault isolation; never treat the 2025 deck as</tspan><tspan x="46" dy="19">validation of the 2021 study.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Synchronized mission replay, subsystem diagram,</tspan><tspan x="506" dy="19">separate DNA-evidence panel.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>