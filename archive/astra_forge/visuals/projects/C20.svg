<title id="t">CHANDRA TRINITY ECHOES research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / C20 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">CHANDRA TRINITY ECHOES</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Which predicted correlations survive actual cadence and observation</tspan><tspan x="28" dy="22">noise?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Published Trinity outputs/definitions, luminosity</tspan><tspan x="46" dy="19">histories, survey cadence and noise; model access not</tspan><tspan x="46" dy="19">assumed.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">ACF(tau)=Cov(x_t,x_(t+tau))/Var(x); irregular</tspan><tspan x="506" dy="19">observations require explicit sampling-window</tspan><tspan x="506" dy="19">treatment and an observation model for theoretical</tspan><tspan x="506" dy="19">accretion histories.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Red-noise surrogates, cadence-matched forward</tspan><tspan x="46" dy="19">simulation and uncertainty in accretion-to-luminosity</tspan><tspan x="46" dy="19">mapping.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Intrinsic/observed autocorrelation, sampling window,</tspan><tspan x="506" dy="19">prediction envelope.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>