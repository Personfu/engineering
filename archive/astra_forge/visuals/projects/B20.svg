<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">TERRA ELEMENT RECLAIMER research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / B20 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">TERRA ELEMENT RECLAIMER</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">What published sorption evidence establishes selective recovery rather</tspan><tspan x="28" dy="22">than simple disappearance?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Public sorption tables, concentration units, competing</tspan><tspan x="46" dy="19">ions, blanks and analytical limits; no biological or</tspan><tspan x="46" dy="19">chemical preparation recipe.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Langmuir q=qmax*K*C/(1+K*C); competitive</tspan><tspan x="506" dy="19">multicomponent adsorption and total metal mass</tspan><tspan x="506" dy="19">balance; recovery efficiency includes desorption</tspan><tspan x="506" dy="19">evidence where published.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Compare alternative isotherms, censoring and measured</tspan><tspan x="46" dy="19">mass closure; separate adsorption, precipitation and</tspan><tspan x="46" dy="19">recovered product purity.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Isotherm confidence bands, competing-ion selectivity</tspan><tspan x="506" dy="19">matrix, mass-balance diagram.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>