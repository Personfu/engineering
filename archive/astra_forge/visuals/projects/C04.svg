<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">SWIFT TIDAL ECHO research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / C04 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">SWIFT TIDAL ECHO</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Which transient observations constrain black-hole properties rather than</tspan><tspan x="28" dy="22">reprocessing geometry?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Public UV/X-ray/optical time series, upper limits,</tspan><tspan x="46" dy="19">redshift, extinction and event classification</tspan><tspan x="46" dy="19">provenance.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Fallback reference Mdot proportional to (t-tD)^(-5/3)</tspan><tspan x="506" dy="19">after peak; luminosity requires efficiency, Eddington</tspan><tspan x="506" dy="19">effects and transfer model; compare flexible empirical</tspan><tspan x="506" dy="19">light curves.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Posterior predictive tests across bands; alternative</tspan><tspan x="46" dy="19">AGN/supernova interpretations; avoid unique mass</tspan><tspan x="46" dy="19">claims from a power-law fit.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Multiband light curves, spectral evolution, parameter</tspan><tspan x="506" dy="19">degeneracy map.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>