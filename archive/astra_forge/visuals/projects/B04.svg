<title id="t">AURORA RIOMETER WATCH research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / B04 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">AURORA RIOMETER WATCH</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">How do absorption signatures relate to independently observed</tspan><tspan x="28" dy="22">ionospheric disturbances?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">CDAWeb/mission radio records where available, time</tspan><tspan x="46" dy="19">UTC, frequency Hz, power, calibration, orbit and</tspan><tspan x="46" dy="19">quality flags; riometer-specific archive availability</tspan><tspan x="46" dy="19">must be verified.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Absorption_dB=10*log10(quiet_reference/received_power)</tspan><tspan x="506" dy="19">; build sidereal quiet-day curves and flag instrument</tspan><tspan x="506" dy="19">gain changes; compare with geomagnetic indices.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Exclude solar-radio interference and gain drift; test</tspan><tspan x="46" dy="19">quiet-day baseline stability; compare event timing</tspan><tspan x="46" dy="19">with independent observatories.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Absorption spectrogram, orbit-context timeline, quiet-</tspan><tspan x="506" dy="19">day residuals.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>