<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">ASCEND ATMOSPHERIC COLUMN research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / E04 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">ASCEND ATMOSPHERIC COLUMN</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Can a vertical gas profile be separated from pressure, humidity and</tspan><tspan x="28" dy="22">sensor cross-sensitivity?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Authorized calibration and flight observations,</tspan><tspan x="46" dy="19">pressure Pa, temperature K, humidity, response time,</tspan><tspan x="46" dy="19">units and sensor type; no measurements supplied.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Mixing ratio x=n_species/n_air; number density</tspan><tspan x="506" dy="19">n=P/(kB*T); sensor response</tspan><tspan x="506" dy="19">y=f(x,P,T,RH,interferents). Tropospheric mixing</tspan><tspan x="506" dy="19">invalidates a simple heavier-gases-sink</tspan><tspan x="506" dy="19">interpretation.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Pressure/temperature chamber data where authorized,</tspan><tspan x="46" dy="19">zero/span drift and ascent/descent comparison; broad</tspan><tspan x="46" dy="19">gas sensors cannot establish species-specific</tspan><tspan x="46" dy="19">concentrations.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Corrected/raw profiles, cross-sensitivity matrix,</tspan><tspan x="506" dy="19">altitude coverage.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>