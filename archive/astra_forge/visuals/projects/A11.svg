<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">STARDUST SULFUR SIGNATURES research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / A11 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">STARDUST SULFUR SIGNATURES</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Can candidate sulfur-bearing signatures be separated from contamination</tspan><tspan x="28" dy="22">and overlapping bands?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Published meteorite spectra, sample metadata, blanks</tspan><tspan x="46" dy="19">and reference spectral library; no new chemical</tspan><tspan x="46" dy="19">extraction procedure.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Absorbance A=-log10(I/I0); constrained mixture</tspan><tspan x="506" dy="19">y(lambda)=sum(a_i*s_i(lambda))+baseline+noise; require</tspan><tspan x="506" dy="19">independent orthogonal evidence for a thiol</tspan><tspan x="506" dy="19">assignment.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Compare blanks, substrate and alternative functional</tspan><tspan x="46" dy="19">groups; propagate wavelength and baseline uncertainty;</tspan><tspan x="46" dy="19">report tentative assignments where specificity is</tspan><tspan x="46" dy="19">weak.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Spectrum overlay, residual panel, contamination-</tspan><tspan x="506" dy="19">control matrix.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>