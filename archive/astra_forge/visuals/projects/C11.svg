<title id="t">LIGO SUPERNOVA INFERENCE research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / C11 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">LIGO SUPERNOVA INFERENCE</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Can parameter inference generalize beyond the waveform family used for</tspan><tspan x="28" dy="22">training?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Published core-collapse waveforms and GWOSC noise,</tspan><tspan x="46" dy="19">distance scaling, detector response and injection</tspan><tspan x="46" dy="19">manifest.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Whitened strain d=h(theta)+n; posterior approximation</tspan><tspan x="506" dy="19">q(theta given d) requires calibrated coverage; splits</tspan><tspan x="506" dy="19">by simulator family, progenitor and noise segment.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Coverage, simulation-family holdouts and signal-to-</tspan><tspan x="46" dy="19">noise strata; compare simple likelihood baselines; no</tspan><tspan x="46" dy="19">astrophysical detections from synthetic runs.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Parameter posterior, coverage curve, waveform-family</tspan><tspan x="506" dy="19">transfer matrix.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>