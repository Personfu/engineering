<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">EAGLESAT POWER PROVING GROUND research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / E08 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">EAGLESAT POWER PROVING GROUND</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">How can a simulated EPS test harness demonstrate requirement coverage</tspan><tspan x="28" dy="22">and fault response?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Authorized EPS requirements, interface maps, component</tspan><tspan x="46" dy="19">ratings and published verification examples; no</tspan><tspan x="46" dy="19">hardware commands or energized testing included.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Bus balance Psource-Pload-Ploss=dE/dt; state-machine</tspan><tspan x="506" dy="19">tests cover undervoltage, load shedding and recovery;</tspan><tspan x="506" dy="19">simulated loads are bounded and explicit.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Requirement-to-test matrix, negative tests,</tspan><tspan x="46" dy="19">clock/packet integrity and independent power</tspan><tspan x="46" dy="19">accounting; simulation passes do not qualify flight</tspan><tspan x="46" dy="19">hardware.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Harness wiring schematic, bus energy ledger, fault-</tspan><tspan x="506" dy="19">sequence replay.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>