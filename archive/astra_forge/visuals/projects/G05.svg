<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">ARES HEALTH RESOURCES research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / G05 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">ARES HEALTH RESOURCES</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Which resource concepts remain plausible after accounting for</tspan><tspan x="28" dy="22">contaminants, energy and health evidence?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">PDS Martian resource context, published ISRU studies</tspan><tspan x="46" dy="19">and health evidence; no medical synthesis, treatment</tspan><tspan x="46" dy="19">or astronaut-use protocol.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">System mass/energy ledger tracks resource -&gt;</tspan><tspan x="506" dy="19">processing -&gt; verified product -&gt; application;</tspan><tspan x="506" dy="19">resource availability and product fitness are</tspan><tspan x="506" dy="19">independent requirements.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Contaminant evidence, transport mass, energy and</tspan><tspan x="46" dy="19">process maturity; separate planetary feasibility from</tspan><tspan x="46" dy="19">biological safety and efficacy.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Resource-to-evidence system map, mass/energy trade</tspan><tspan x="506" dy="19">space, validation gaps.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>