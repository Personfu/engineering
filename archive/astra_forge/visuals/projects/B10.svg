<title id="t">LANDSAT COMMUNITY CANOPY research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / B10 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">LANDSAT COMMUNITY CANOPY</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">How do observed vegetation changes overlap community-defined exposure</tspan><tspan x="28" dy="22">and access concerns?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Landsat QA reflectance, approved community boundaries,</tspan><tspan x="46" dy="19">land cover, climate and documented local priorities.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Trend NDVI_t=beta0+beta1*t+season+sensor effect;</tspan><tspan x="506" dy="19">aggregate to community-approved zones; distinguish</tspan><tspan x="506" dy="19">canopy, greenness and ecosystem function.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Compare sensors and seasonal windows; validate field</tspan><tspan x="46" dy="19">samples; report ecological fallacy and boundary</tspan><tspan x="46" dy="19">uncertainty.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Canopy-change atlas, zonal uncertainty bars,</tspan><tspan x="506" dy="19">provenance-linked community briefing.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>