<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">TERRA CARBON SWING research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / G06 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">TERRA CARBON SWING</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">What moisture-dependent sorption behavior is supported under a closed</tspan><tspan x="28" dy="22">carbon and energy balance?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Published sorption/kinetic measurements, inlet/outlet</tspan><tspan x="46" dy="19">CO2, humidity, temperature, cycle duration and energy</tspan><tspan x="46" dy="19">boundaries; no chemical preparation instructions.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">q=f(relative_humidity,pCO2,T); cyclic captured</tspan><tspan x="506" dy="19">mass=integral(flow*(Cin-Cout) dt); net removal</tspan><tspan x="506" dy="19">subtracts process emissions and losses.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Instrument drift, blank cycles, desorption closure and</tspan><tspan x="46" dy="19">lifecycle assumptions; captured carbon is not net</tspan><tspan x="46" dy="19">atmospheric removal by itself.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Humidity-sorption hysteresis, cycle mass balance, net-</tspan><tspan x="506" dy="19">removal scenarios.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>