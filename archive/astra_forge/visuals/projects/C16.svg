<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">LIGO CALIBRATION LENS research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / C16 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">LIGO CALIBRATION LENS</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">How do detector amplitude and phase uncertainty affect burst inference?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Published detector calibration uncertainty and</tspan><tspan x="46" dy="19">synthetic supernova injections, strain units,</tspan><tspan x="46" dy="19">frequency grid and noise realization.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">d_cal(f)=(1+deltaA(f))*exp(i*deltaPhi(f))*d_true(f);</tspan><tspan x="506" dy="19">marginalize correlated calibration functions when</tspan><tspan x="506" dy="19">computing physical parameter posteriors.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Zero-error recovery, known perturbation injections and</tspan><tspan x="46" dy="19">posterior coverage; avoid treating independent-bin</tspan><tspan x="46" dy="19">noise as calibration covariance.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Calibration envelope, distorted waveform, parameter-</tspan><tspan x="506" dy="19">bias surface.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>