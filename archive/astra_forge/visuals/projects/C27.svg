<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">SPHEREX SPECTRAL ATLAS research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / C27 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">SPHEREX SPECTRAL ATLAS</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">How does a survey strategy translate into spectral coverage and</tspan><tspan x="28" dy="22">selection effects?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Current official SPHEREx mission information and</tspan><tspan x="46" dy="19">public products when released; historical title</tspan><tspan x="46" dy="19">retained and marked as a 2021 title.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Map visit footprints and spectral response to sky</tspan><tspan x="506" dy="19">pixels; coverage N(p)=sum(visits containing p);</tspan><tspan x="506" dy="19">constrain Sun/Moon geometry using mission</tspan><tspan x="506" dy="19">documentation.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Cross-check dates and releases; validate footprint</tspan><tspan x="46" dy="19">geometry; never present a proposed schedule as actual</tspan><tspan x="46" dy="19">spacecraft commanding.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Spectral coverage atlas, visit-count map, mission-era</tspan><tspan x="506" dy="19">timeline.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>