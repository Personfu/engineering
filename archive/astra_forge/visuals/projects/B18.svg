<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">AQUA SOUTHERN CARBON research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / B18 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">AQUA SOUTHERN CARBON</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">How do wind changes redistribute carbon flux and storage in alternative</tspan><tspan x="28" dy="22">ocean states?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Ocean carbon products, wind stress, mixed-layer depth,</tspan><tspan x="46" dy="19">sea ice and ensemble circulation outputs.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Air-sea F=k*K0*(pCO2_water-pCO2_air); mixed-layer dC/d</tspan><tspan x="506" dy="19">t=surface_flux/depth+entrainment+biology+advection;</tspan><tspan x="506" dy="19">flux sign and units documented.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Close regional budgets, compare buoy observations and</tspan><tspan x="46" dy="19">seasonal coverage; separate flux changes from carbon</tspan><tspan x="46" dy="19">storage changes.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Wind-carbon response map, mixed-layer budget, seasonal</tspan><tspan x="506" dy="19">flux ensemble.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>