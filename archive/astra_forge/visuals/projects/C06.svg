<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">CHANDRA MAGNETAR COMPANION research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / C06 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">CHANDRA MAGNETAR COMPANION</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">What observations distinguish an actual bound companion from a chance</tspan><tspan x="28" dy="22">alignment?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Public timing, spectra, astrometry, positional errors</tspan><tspan x="46" dy="19">and published candidate identity; preserve the</tspan><tspan x="46" dy="19">question mark and historical context.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Compare binary and isolated timing models; mass</tspan><tspan x="506" dy="19">function f(M)=P*K^3*(1-e^2)^(3/2)/(2*pi*G);</tspan><tspan x="506" dy="19">association prior uses local source density and</tspan><tspan x="506" dy="19">astrometry.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Likelihood comparisons, timing noise and chance-</tspan><tspan x="46" dy="19">alignment tests; non-detection constrains rather than</tspan><tspan x="46" dy="19">proves absence.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Timing residuals, companion evidence map, candidate</tspan><tspan x="506" dy="19">probability ledger.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>