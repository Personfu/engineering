<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">ASCEND PICO PATHFINDER research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / I05 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">ASCEND PICO PATHFINDER</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Which sensing concepts fit a very small balloon mass and energy budget?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Official atmospheric references, component</tspan><tspan x="46" dy="19">specifications and published balloon studies;</tspan><tspan x="46" dy="19">hypothetical configuration and environmental sensing</tspan><tspan x="46" dy="19">only.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Buoyancy=(rho_air-rho_gas)*V*g; payload/system mass</tspan><tspan x="506" dy="19">closes lift budget; harvested energy and sensor duty</tspan><tspan x="506" dy="19">cycle evaluated against atmospheric scenarios.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Mass/energy closure, temperature/pressure response and</tspan><tspan x="46" dy="19">scenario sensitivity; no flight authorization or</tspan><tspan x="46" dy="19">launch-ready prediction.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Buoyancy envelope, power duty cycle, payload subsystem</tspan><tspan x="506" dy="19">model.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>