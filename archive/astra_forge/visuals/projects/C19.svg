<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">SPITZER DWARF ATMOSPHERES research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / C19 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">SPITZER DWARF ATMOSPHERES</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Which spectral features disentangle gravity, temperature, metallicity</tspan><tspan x="28" dy="22">and clouds?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Public M-dwarf spectra, photometry, parallax,</tspan><tspan x="46" dy="19">extinction, instrument response and atmosphere-grid</tspan><tspan x="46" dy="19">version.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Forward spectrum</tspan><tspan x="506" dy="19">F_lambda=atmosphere(T_eff,logg,Z,clouds) convolved</tspan><tspan x="506" dy="19">with line-spread function; compare model families</tspan><tspan x="506" dy="19">rather than relying on one template grid.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Posterior predictive spectra, gravity-sensitive bands</tspan><tspan x="46" dy="19">and alternative grids; broad priors and degeneracy</tspan><tspan x="46" dy="19">reporting.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Spectrum/model residuals, gravity-temperature</tspan><tspan x="506" dy="19">posterior, band-sensitivity diagram.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>