<title id="t">CHANDRA WOLF WIND research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / C01 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">CHANDRA WOLF WIND</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Which variability signatures distinguish wind structure from orbital</tspan><tspan x="28" dy="22">explanations?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Public time-series spectra and photometry, exposure</tspan><tspan x="46" dy="19">UTC, instrument, wavelength frame, quality flags and</tspan><tspan x="46" dy="19">published period priors.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Phase phi=fract((t-t0)/P); jointly fit line-profile</tspan><tspan x="506" dy="19">variability and photometric periodicity with</tspan><tspan x="506" dy="19">correlated noise; alternative periods and aliases</tspan><tspan x="506" dy="19">retained.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Window-function analysis, season holdouts and line-</tspan><tspan x="46" dy="19">dependent phase shifts; periodicity alone does not</tspan><tspan x="46" dy="19">prove binarity.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Phase-resolved spectral waterfall, periodogram</tspan><tspan x="506" dy="19">aliases, competing-model residuals.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>