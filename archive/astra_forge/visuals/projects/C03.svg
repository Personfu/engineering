<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">SPITZER TAURUS FILAMENTS research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / C03 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">SPITZER TAURUS FILAMENTS</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">How do HCN line maps constrain kinematics without assuming universal</tspan><tspan x="28" dy="22">density conversion?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Public radio spectral cubes, brightness units, beam,</tspan><tspan x="46" dy="19">channel width, rest frequency, noise and telescope</tspan><tspan x="46" dy="19">calibration.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Moment0=integral(T_B dv);</tspan><tspan x="506" dy="19">centroid=sum(T_B*v)/sum(T_B); linewidth from weighted</tspan><tspan x="506" dy="19">variance; model hyperfine components and optical depth</tspan><tspan x="506" dy="19">where supported.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Noise-aware masks, beam matching and baseline checks;</tspan><tspan x="46" dy="19">compare other molecular tracers; HCN intensity is not</tspan><tspan x="46" dy="19">directly a unique gas density.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Velocity-channel cube, moment maps, filament position-</tspan><tspan x="506" dy="19">velocity slices.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>