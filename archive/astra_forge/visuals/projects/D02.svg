<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">XPLANE STALL MEMORY research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / D02 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">XPLANE STALL MEMORY</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Which sweep-rate and boundary-layer factors explain distinct stall and</tspan><tspan x="28" dy="22">reattachment paths?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Published alpha/lift time series, Reynolds number,</tspan><tspan x="46" dy="19">reduced pitch rate, surface condition and repeat runs.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Lag model dx/dt=(x_eq(alpha)-x)/tau; CL blends</tspan><tspan x="506" dy="19">attached and separated states; upward/downward sweeps</tspan><tspan x="506" dy="19">share physical state history.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Sweep-rate dependence, quasi-static limit and</tspan><tspan x="46" dy="19">repeatability; model hysteresis is descriptive until</tspan><tspan x="46" dy="19">independently validated.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Lift-angle hysteresis loop, separation-state timeline,</tspan><tspan x="506" dy="19">sweep-rate comparison.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>