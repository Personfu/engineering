<title id="t">TERRA BIOENERGY BALANCE research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / B28 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">TERRA BIOENERGY BALANCE</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Do published gas gains exceed pretreatment energy under a consistent</tspan><tspan x="28" dy="22">system boundary?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Published cumulative gas curves, methane fraction,</tspan><tspan x="46" dy="19">blank corrections and reported energy inputs; no</tspan><tspan x="46" dy="19">biological preparation or gas-handling protocol.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Modified Gompertz gas</tspan><tspan x="506" dy="19">G=A*exp(-exp((rmax*e/A)*(lag-t)+1)); net energy=gas</tspan><tspan x="506" dy="19">heating value*yield-treatment and auxiliary energy.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Compare blanks, fit identifiability and uncertainty;</tspan><tspan x="46" dy="19">report methane versus total gas; include processing</tspan><tspan x="46" dy="19">energy and scale effects.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Gas-yield curves, energy budget, uncertainty-aware</tspan><tspan x="506" dy="19">pretreatment comparison.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>