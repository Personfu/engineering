<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">ARTEMIS LUNAR MAGNETISM research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / H03 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">ARTEMIS LUNAR MAGNETISM</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Which anomaly geometries are supported by orbital magnetic measurements?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">PDS lunar magnetometer products, spacecraft geometry,</tspan><tspan x="46" dy="19">nT vectors, altitude and quality flags.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Dipole B=mu0/(4*pi*r^3)*(3*(m dot rhat)*rhat-m);</tspan><tspan x="506" dy="19">inversions require altitude, vector frame, external</tspan><tspan x="506" dy="19">field removal and regularization.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Independent passes, altitude continuation stability</tspan><tspan x="46" dy="19">and regularization sensitivity; non-unique dipoles do</tspan><tspan x="46" dy="19">not identify a unique buried source.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">South-polar anomaly map, vector field, inverse-model</tspan><tspan x="506" dy="19">uncertainty.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>