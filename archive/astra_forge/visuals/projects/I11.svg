<title id="t">HUBBLE SKY RECEIPTS research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / I11 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">HUBBLE SKY RECEIPTS</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">How can archival sky measurements be audited independently of their</tspan><tspan x="28" dy="22">downstream interpretation?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">MAST HST exposures and SKYSURF context, observation</tspan><tspan x="46" dy="19">geometry, calibration versions and rejection reasons.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Exposure-level estimator y=background statistic with</tspan><tspan x="506" dy="19">calibrated gain, masks and units; track raw -&gt;</tspan><tspan x="506" dy="19">calibrated -&gt; masked -&gt; measured -&gt; interpreted</tspan><tspan x="506" dy="19">lineage.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Independent estimator comparison, calibration changes</tspan><tspan x="46" dy="19">and repeat fields; preserve this project separately</tspan><tspan x="46" dy="19">from the SKYSURF science and simulation projects.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Exposure quality board, provenance graph, sky-estimate</tspan><tspan x="506" dy="19">comparison.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>