<title id="t">NEW HORIZONS CRYOPHASE research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / A02 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">NEW HORIZONS CRYOPHASE</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Which mixture assumptions change predicted coexistence temperatures</tspan><tspan x="28" dy="22">most?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">PDS Pluto composition context; laboratory melting</tspan><tspan x="46" dy="19">temperatures, fusion enthalpies, uncertainty and</tspan><tspan x="46" dy="19">pressure range; no fitted Pluto observations supplied.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Minimize G=sum(x_i*mu_i); ideal binary liquidus</tspan><tspan x="506" dy="19">ln(x_i)=-DeltaHfus_i/R*(1/T-1/Tm_i). Add activity</tspan><tspan x="506" dy="19">coefficients before treating real mixtures.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Recover pure-component limits and compare measured</tspan><tspan x="46" dy="19">phase diagrams; Monte Carlo activity-model</tspan><tspan x="46" dy="19">uncertainty; reject extrapolation outside measured</tspan><tspan x="46" dy="19">pressure.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Temperature-composition phase diagram, free-energy</tspan><tspan x="506" dy="19">common tangents, uncertainty envelope.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>