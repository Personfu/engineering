<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">CHANDRA QUANTUM CORE research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / A03 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">CHANDRA QUANTUM CORE</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">How do pairing assumptions affect neutron-matter energy gaps and cooling</tspan><tspan x="28" dy="22">interpretations?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Published equation-of-state and pairing tables with</tspan><tspan x="46" dy="19">density fm^-3, gap MeV and temperature K;</tspan><tspan x="46" dy="19">observational cooling constraints from HEASARC.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">BCS reference E_k=sqrt((epsilon_k-mu)^2+Delta^2);</tspan><tspan x="506" dy="19">solve gap and number equations together. Research</tspan><tspan x="506" dy="19">model requires interacting many-body calculations and</tspan><tspan x="506" dy="19">finite-size corrections.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Reproduce a published benchmark before astrophysical</tspan><tspan x="46" dy="19">inference; vary interaction, regulator, volume and</tspan><tspan x="46" dy="19">trial state; do not equate a toy BCS curve with</tspan><tspan x="46" dy="19">neutron-star predictions.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Density-gap curves, pairing-shell schematic,</tspan><tspan x="506" dy="19">uncertainty-separated cooling comparison.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>