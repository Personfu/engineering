<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">ASCEND RADIATION LADDER research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / E03 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">ASCEND RADIATION LADDER</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">How does detector count rate vary with altitude after exposure and</tspan><tspan x="28" dy="22">detector-response correction?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Authorized flight UTC, altitude m, live time s,</tspan><tspan x="46" dy="19">detector counts, thresholds, dead time and</tspan><tspan x="46" dy="19">pressure/temperature.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Counts N~Poisson(rate*live_time); rate=N/live_time;</tspan><tspan x="506" dy="19">uncertainty sqrt(N)/live_time is large-count</tspan><tspan x="506" dy="19">approximation; count rate is not dose without response</tspan><tspan x="506" dy="19">calibration.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Exact Poisson intervals at low counts, altitude-bin</tspan><tspan x="46" dy="19">exposure correction and response stability; compare</tspan><tspan x="46" dy="19">ascent/descent and independent detector evidence.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Altitude-count profile, exposure coverage, response</tspan><tspan x="506" dy="19">uncertainty.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>