<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">ORION ATTITUDE STUDIO research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / I10 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">ORION ATTITUDE STUDIO</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Can a reference controller settle attitude under bounded torque and</tspan><tspan x="28" dy="22">sensor uncertainty?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Synthetic inertia kg*m^2, initial attitude, rate</tspan><tspan x="46" dy="19">rad/s, torque N*m and sensor noise; no flight</tspan><tspan x="46" dy="19">controller integration.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">q_dot=0.5*Omega(omega)*q; J*omega_dot+omega cross</tspan><tspan x="506" dy="19">Jomega=tau_control+tau_disturbance; quaternion PD</tspan><tspan x="506" dy="19">feedback with torque saturation and sign-equivalent</tspan><tspan x="506" dy="19">attitude handling.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Quaternion norm, zero-torque conservation, saturation</tspan><tspan x="46" dy="19">and step convergence; compare multiple axes and</tspan><tspan x="46" dy="19">inertia conditions.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Rotatable CubeSat, quaternion error, rate/torque</tspan><tspan x="506" dy="19">histories.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>