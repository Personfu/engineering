<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">ARTEMIS CILIA ARRAY research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / A05 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">ARTEMIS CILIA ARRAY</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">How does flexible-element geometry control sensor sensitivity and</tspan><tspan x="28" dy="22">bandwidth?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Material modulus Pa, element geometry m, displacement</tspan><tspan x="46" dy="19">m, frequency Hz and temperature; use inert educational</tspan><tspan x="46" dy="19">fixtures.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Euler-Bernoulli EI*y&#x27;&#x27;&#x27;&#x27;=q; tip deflection</tspan><tspan x="506" dy="19">F*L^3/(3EI); coupled oscillator m*y&#x27;&#x27;+c*y&#x27;+k*y=F(t);</tspan><tspan x="506" dy="19">fluid loading changes effective mass and damping.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Recover beam analytic limits; compare independent</tspan><tspan x="46" dy="19">force calibration; measure hysteresis, creep, fatigue</tspan><tspan x="46" dy="19">and channel cross-talk.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Array geometry, deflection field, transfer-function</tspan><tspan x="506" dy="19">magnitude and phase.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>