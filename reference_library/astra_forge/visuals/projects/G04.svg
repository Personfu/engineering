<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">ORION MATERIALS MATRIX research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / G04 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">ORION MATERIALS MATRIX</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Which published mechanical properties support a material comparison</tspan><tspan x="28" dy="22">without implying implant readiness?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Published modulus, relaxation, swelling and</tspan><tspan x="46" dy="19">cytocompatibility results with units, conditioning and</tspan><tspan x="46" dy="19">replicate metadata; no fabrication or clinical</tspan><tspan x="46" dy="19">procedure.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Linear viscoelastic reference</tspan><tspan x="506" dy="19">stress(t)=integral(G(t-s)*dstrain/ds ds); generalized</tspan><tspan x="506" dy="19">Maxwell G=sum(G_i*exp(-t/tau_i)); separate rheology,</tspan><tspan x="506" dy="19">mechanics and biocompatibility.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Compare strain/rate domains and batch effects;</tspan><tspan x="46" dy="19">independent residual checks; no inference of safe</tspan><tspan x="46" dy="19">implantation from mechanical fit.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Relaxation spectra, modulus/rate map, evidence</tspan><tspan x="506" dy="19">maturity matrix.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>