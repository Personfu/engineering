<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">APOLLO FRACTAL research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / A01 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">APOLLO FRACTAL</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Can adaptive precision reduce boundary-rendering cost without changing</tspan><tspan x="28" dy="22">set membership?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Complex-plane bounds, precision bits, iteration cap,</tspan><tspan x="46" dy="19">escape count, elapsed time; synthetic coordinates</tspan><tspan x="46" dy="19">only.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">z(n+1)=z(n)^2+c; Mandelbrot z0=0; Julia fixes c and</tspan><tspan x="506" dy="19">varies z0. Track derivative d(n+1)=2z(n)d(n)+1 for</tspan><tspan x="506" dy="19">Mandelbrot distance estimation.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Compare escape counts with high-precision reference</tspan><tspan x="46" dy="19">points; distinguish unresolved bounded iterates from</tspan><tspan x="46" dy="19">proven membership; benchmark identical viewports.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Linked Mandelbrot/Julia planes, precision error tiles,</tspan><tspan x="506" dy="19">boundary zoom, runtime-versus-error curve.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>