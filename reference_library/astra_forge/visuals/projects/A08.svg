<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">PULSAR LIGHT COMPRESSOR research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / A08 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">PULSAR LIGHT COMPRESSOR</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">When does spectral broadening improve recoverable pulse duration without</tspan><tspan x="28" dy="22">unacceptable distortion?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Published pulse spectra, phase, duration fs, beam</tspan><tspan x="46" dy="19">radius and medium properties; no physical high-power</tspan><tspan x="46" dy="19">operating instructions.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Reference nonlinear Schrodinger envelope:</tspan><tspan x="506" dy="19">dA/dz=-i*beta2/2*d2A/dt2+i*gamma*abs(A)^2*A; B</tspan><tspan x="506" dy="19">integral=integral(k0*n2*I dz). Add losses and higher-</tspan><tspan x="506" dy="19">order dispersion in research runs.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Check energy conservation in lossless propagation;</tspan><tspan x="46" dy="19">halve time and spatial steps; compare reconstructed</tspan><tspan x="46" dy="19">pulse against independent temporal diagnostics.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Time-frequency map, spectral phase, pulse</tspan><tspan x="506" dy="19">before/after, convergence plot.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>