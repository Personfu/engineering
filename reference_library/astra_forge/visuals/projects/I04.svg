<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">EAGLESAT FLIGHT BRAIN research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / I04 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">EAGLESAT FLIGHT BRAIN</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Can a software-only OBC model preserve telemetry and recover from</tspan><tspan x="28" dy="22">simulated faults?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Historical EagleSat provenance, authorized interface</tspan><tspan x="46" dy="19">requirements and synthetic fault/test vectors; no</tspan><tspan x="46" dy="19">uploaded flight software.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Finite-state machine with boot, nominal, degraded and</tspan><tspan x="506" dy="19">safe states; triple modular voting majority(a,b,c);</tspan><tspan x="506" dy="19">packet sequence, checksum and watchdog timing modeled</tspan><tspan x="506" dy="19">explicitly.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Single-channel corruption, reboot, packet replay and</tspan><tspan x="46" dy="19">missing sensor tests; TMR cannot eliminate common-mode</tspan><tspan x="46" dy="19">failures.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">OBC state diagram, subsystem bus, fault recovery</tspan><tspan x="506" dy="19">timeline.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>