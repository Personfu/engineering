<title id="t">OSIRIS HOPPER LAB research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / I09 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">OSIRIS HOPPER LAB</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">When does a hop remain bounded under uncertain gravity, terrain and</tspan><tspan x="28" dy="22">contact behavior?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Published small-body gravity/shape models, inert</tspan><tspan x="46" dy="19">mechanism measurements and synthetic contact</tspan><tspan x="46" dy="19">parameters.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Ballistic reference range=v0^2*sin(2theta)/g and</tspan><tspan x="506" dy="19">height=v0^2*sin(theta)^2/(2g); small-body research</tspan><tspan x="506" dy="19">model adds irregular gravity, rotation and contact</tspan><tspan x="506" dy="19">dynamics.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Flat-ground analytic limits, energy accounting and</tspan><tspan x="46" dy="19">restitution sensitivity; constant-g trajectories are</tspan><tspan x="46" dy="19">not asteroid mission predictions.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Hop trajectories, contact-energy ledger,</tspan><tspan x="506" dy="19">terrain/gravity uncertainty.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>