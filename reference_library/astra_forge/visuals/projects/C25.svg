<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">LIGO BURST RECOVERY research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / C25 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">LIGO BURST RECOVERY</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Which detection changes improve sensitivity at a fixed false-alarm rate?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">GWOSC detector noise segments, synthetic core-collapse</tspan><tspan x="46" dy="19">waveforms, detector response and blind injection</tspan><tspan x="46" dy="19">manifest.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Signal detection based on coherent excess power or</tspan><tspan x="506" dy="19">matched reference injections; report</tspan><tspan x="506" dy="19">efficiency(distance, waveform) at fixed background</tspan><tspan x="506" dy="19">false-alarm rate.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Disjoint noise time, waveform-family holdouts and</tspan><tspan x="46" dy="19">trials accounting; no sensitivity claim without a</tspan><tspan x="46" dy="19">complete background experiment.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Efficiency curves, time-frequency burst map, false-</tspan><tspan x="506" dy="19">alarm tradeoff.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>