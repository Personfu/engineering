<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">OSIRIS APOPHIS CONTEXT research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / I13 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">OSIRIS APOPHIS CONTEXT</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">How can historical deflection scenarios be explained without</tspan><tspan x="28" dy="22">misrepresenting current impact assessments?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Current JPL CNEOS/Horizons object information,</tspan><tspan x="46" dy="19">assessment date, covariance/solution identifiers and</tspan><tspan x="46" dy="19">historical project citation.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Public-data orbit uncertainty and conceptual delta-v</tspan><tspan x="506" dy="19">sensitivity; impact probability requires official</tspan><tspan x="506" dy="19">covariance propagation and planetary encounter</tspan><tspan x="506" dy="19">dynamics, not a toy linear offset.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Verify current risk statements directly from official</tspan><tspan x="46" dy="19">records; distinguish historic study, illustrative</tspan><tspan x="46" dy="19">scenario and present trajectory; no mission or</tspan><tspan x="46" dy="19">deflection operation.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Historical/current assessment timeline, encounter</tspan><tspan x="506" dy="19">geometry schematic, uncertainty explanation.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>