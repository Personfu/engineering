<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">VOYAGER SWARM SENSE research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / A04 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">VOYAGER SWARM SENSE</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Can local distributed particles locate a simulated environmental signal</tspan><tspan x="28" dy="22">despite node failures?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Synthetic scalar field, graph topology, packet loss</tspan><tspan x="46" dy="19">and labeled signal locations; environmental targets</tspan><tspan x="46" dy="19">only.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Particles on a graph hold local states; neighbor</tspan><tspan x="506" dy="19">consensus x_i(next)=x_i+alpha*sum_j(x_j-x_i);</tspan><tspan x="506" dy="19">detection requires threshold persistence and</tspan><tspan x="506" dy="19">connected-component agreement.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Measure precision, recall, time-to-consensus and</tspan><tspan x="46" dy="19">message cost against centralized and random baselines;</tspan><tspan x="46" dy="19">vary connectivity and adversarial noise in simulation.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Particle lattice, consensus propagation, failure</tspan><tspan x="506" dy="19">masks, detection-latency distribution.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>