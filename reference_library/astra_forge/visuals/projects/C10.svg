<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">GAIA LOCAL GROUP HALOS research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / C10 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">GAIA LOCAL GROUP HALOS</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">How does environment change halo velocity dispersion in comparable</tspan><tspan x="28" dy="22">simulated systems?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Public simulation snapshots or published halo</tspan><tspan x="46" dy="19">profiles, coordinates, mass resolution, halo</tspan><tspan x="46" dy="19">definition and Milky Way/M31 selection criteria.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Jeans reference d(rho*sigma_r^2)/dr+2*beta*rho*sigma_r</tspan><tspan x="506" dy="19">^2/r=-rho*dPhi/dr; simulation estimator uses shell-</tspan><tspan x="506" dy="19">centered velocities and selection masks.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Particle-resolution convergence, anisotropy</tspan><tspan x="46" dy="19">sensitivity and matched halo masses; dark matter</tspan><tspan x="46" dy="19">dispersion is not directly observed stellar</tspan><tspan x="46" dy="19">dispersion.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Radial dispersion bands, halo-pair schematic, sample-</tspan><tspan x="506" dy="19">selection audit.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>