<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">APOLLO HEAT SHIELD research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / I02 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">APOLLO HEAT SHIELD</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Which measured heat-transfer assumptions dominate cooling-model</tspan><tspan x="28" dy="22">uncertainty?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Published thermal test data, material properties and</tspan><tspan x="46" dy="19">heat balance; generic nondimensional educational</tspan><tspan x="46" dy="19">parameters only; no build or firing procedure.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Wall conduction q&#x27;&#x27;=k*(Thot-Tcold)/thickness; coolant</tspan><tspan x="506" dy="19">Q=m_dot*cp*DeltaT; couple transient wall capacitance</tspan><tspan x="506" dy="19">with uncertain heat-transfer coefficients.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Hot/cold-side heat closure, mesh/time convergence and</tspan><tspan x="46" dy="19">measured temperatures; exclude unvalidated boiling</tspan><tspan x="46" dy="19">assumptions.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Wall-temperature field, coolant heat balance,</tspan><tspan x="506" dy="19">uncertainty budget.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>