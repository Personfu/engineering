<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">DEEP SPACE BEAM MAP research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / G03 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">DEEP SPACE BEAM MAP</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">How do calibration and site reflections affect inferred antenna gain</tspan><tspan x="28" dy="22">patterns?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Published antenna patterns or authorized measurement</tspan><tspan x="46" dy="19">logs, angle, frequency, reference gain, path geometry</tspan><tspan x="46" dy="19">and uncertainty.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Normalized ideal dipole power proportional to</tspan><tspan x="506" dy="19">(cos((pi/2)*cos(theta))/sin(theta))^2; real gain from</tspan><tspan x="506" dy="19">calibrated substitution includes cable loss and</tspan><tspan x="506" dy="19">polarization.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Normalization/integrated-power checks, far-field</tspan><tspan x="46" dy="19">assumptions, reflection and polarization controls;</tspan><tspan x="46" dy="19">illustrative pattern is not measured ground-station</tspan><tspan x="46" dy="19">gain.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Polar radiation pattern, 3D educational beam surface,</tspan><tspan x="506" dy="19">calibration uncertainty.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>