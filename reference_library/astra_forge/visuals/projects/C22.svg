<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">HUBBLE GALACTIC OUTFLOWS research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / C22 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">HUBBLE GALACTIC OUTFLOWS</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Does environment predict outflow incidence after controlling for</tspan><tspan x="28" dy="22">detection sensitivity?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Spectral outflow diagnostics, galaxy catalogs,</tspan><tspan x="46" dy="19">redshift, environment definition, mass/SFR estimates</tspan><tspan x="46" dy="19">and sensitivity.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Incidence modeled as</tspan><tspan x="506" dy="19">logistic(environment+mass+SFR+inclination); Mdot_out</tspan><tspan x="506" dy="19">approximately geometry_factor*Mgas*v/R with major</tspan><tspan x="506" dy="19">geometry and ionization uncertainty.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Matched populations, completeness controls and</tspan><tspan x="46" dy="19">alternative environment measures; measured line widths</tspan><tspan x="46" dy="19">are not alone wind speed.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Outflow incidence versus environment, velocity</tspan><tspan x="506" dy="19">profiles, mass-flow uncertainty budget.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>