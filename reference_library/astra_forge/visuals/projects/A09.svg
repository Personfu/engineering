<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">ROMAN RADIO ORIGINS research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / A09 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">ROMAN RADIO ORIGINS</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">How robust is a source-population interpretation to flux limits and</tspan><tspan x="28" dy="22">ambiguous classifications?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">NRAO catalogs, survey area, flux microJy, redshift,</tspan><tspan x="46" dy="19">infrared counterpart, upper limits and completeness</tspan><tspan x="46" dy="19">curves.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Mixture likelihood p(y)=f_SF*p(y given</tspan><tspan x="506" dy="19">SF)+(1-f_SF)*p(y given AGN); correct selection and</tspan><tspan x="506" dy="19">completeness. Radio/infrared ratio is evidence, not a</tspan><tspan x="506" dy="19">definitive single-source classifier.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Use probabilistic labels and censored fluxes; compare</tspan><tspan x="46" dy="19">luminosity functions by redshift; bootstrap fields to</tspan><tspan x="46" dy="19">expose cosmic variance.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Flux-redshift plane, mixture posterior, completeness</tspan><tspan x="506" dy="19">boundary and classification ambiguity.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>