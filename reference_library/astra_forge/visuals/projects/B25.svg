<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">TERRA SEED LAUNCH research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / B25 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">TERRA SEED LAUNCH</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Which seed traits predict germination beyond species and treatment</tspan><tspan x="28" dy="22">effects?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Authorized published seed size, dormancy traits,</tspan><tspan x="46" dy="19">pellet category, replicate counts and germination</tspan><tspan x="46" dy="19">observations.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Success y~Binomial(n,p); logit(p)=trait</tspan><tspan x="506" dy="19">coefficients+species/treatment random effects;</tspan><tspan x="506" dy="19">survival analysis handles time-to-germination</tspan><tspan x="506" dy="19">censoring.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Hold out species and batches; measure calibration and</tspan><tspan x="46" dy="19">Brier score; avoid treating individual seeds from one</tspan><tspan x="46" dy="19">batch as independent experiments.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Trait-response curves, calibration plot, germination</tspan><tspan x="506" dy="19">survival curves.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>