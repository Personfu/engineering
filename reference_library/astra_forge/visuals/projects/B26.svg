<title id="t">HELIOS SOLAR LOADS research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / B26 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">HELIOS SOLAR LOADS</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">How does controllable load scheduling affect solar utilization and</tspan><tspan x="28" dy="22">energy accounting?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Published PV curves, irradiance W/m^2, temperature,</tspan><tspan x="46" dy="19">load time series and efficiency bounds; model only, no</tspan><tspan x="46" dy="19">gas-generation operating procedure.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Ppv=G*A*eta(T); energy storage evolves</tspan><tspan x="506" dy="19">dE/dt=eta_charge*Pcharge-Pdischarge/eta_discharge;</tspan><tspan x="506" dy="19">theoretical electrolysis n_H2=eta_F*integral(I</tspan><tspan x="506" dy="19">dt)/(2F).</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Energy closure, dark and rated-condition limits;</tspan><tspan x="46" dy="19">compare weather holdouts; keep Faradaic and energy</tspan><tspan x="46" dy="19">efficiencies separate.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Power dispatch timeline, lost-energy ledger, modeled</tspan><tspan x="506" dy="19">hydrogen yield sensitivity.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>