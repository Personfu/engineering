<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">ALMA KEPLERIAN STACK research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / H07 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">ALMA KEPLERIAN STACK</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Does velocity-aligned stacking increase detection reliability at a</tspan><tspan x="28" dy="22">controlled false-positive rate?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">ALMA cubes, channel response, beam, stellar mass,</tspan><tspan x="46" dy="19">distance, inclination, isotopologue rest frequency and</tspan><tspan x="46" dy="19">noise covariance.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">v_los=sqrt(G*Mstar/r)*sin(i)*cos(phi)+v_sys; shift</tspan><tspan x="506" dy="19">spectra to expected velocities then stack using</tspan><tspan x="506" dy="19">inverse variance and correlated-noise correction.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Blind injections, off-line stacks and geometry</tspan><tspan x="46" dy="19">perturbations; optical depth and abundance prevent</tspan><tspan x="46" dy="19">direct gas-mass inference.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Disk channel maps, aligned spectrum, injection-</tspan><tspan x="506" dy="19">recovery efficiency.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>