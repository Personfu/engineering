<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">LOWELL PHOTON STANDARD research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / C28 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">LOWELL PHOTON STANDARD</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">How do filter throughput, extinction and color terms affect absolute</tspan><tspan x="28" dy="22">photometry?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Authorized Lowell measurements, CALSPEC standards,</tspan><tspan x="46" dy="19">airmass, filter transmission, gain, dark and flat</tspan><tspan x="46" dy="19">versions.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">m_inst=-2.5*log10(counts/exposure);</tspan><tspan x="506" dy="19">m_standard=m_inst+ZP+kX+c*color; physical flux needs</tspan><tspan x="506" dy="19">bandpass integration against standard spectra.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Independent standards, nightly holdouts and</tspan><tspan x="46" dy="19">nonlinearity checks; Vega assumptions and magnitude</tspan><tspan x="46" dy="19">system explicit.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Zero-point versus airmass, throughput overlay,</tspan><tspan x="506" dy="19">residual-color relation.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>