<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">TERRA NITROGEN HERITAGE research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / B22 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">TERRA NITROGEN HERITAGE</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Which existing sequence and ecological evidence supports evolutionary</tspan><tspan x="28" dy="22">hypotheses about fixation?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Published nitrogen-fixation genes, annotations,</tspan><tspan x="46" dy="19">phylogenies and ecological metadata; no organism</tspan><tspan x="46" dy="19">modification, culture or genetic optimization</tspan><tspan x="46" dy="19">workflow.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Comparative public-data trait model</tspan><tspan x="506" dy="19">P(trait)=logistic(beta*environment+phylogenetic</tspan><tspan x="506" dy="19">effect); mechanistic energy budget remains conceptual</tspan><tspan x="506" dy="19">until validated measurements exist.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Accession/version audit, orthology checks and</tspan><tspan x="46" dy="19">phylogenetic controls; distinguish gene presence from</tspan><tspan x="46" dy="19">measured fixation activity.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Trait phylogeny, gene-evidence map, hypothesis</tspan><tspan x="506" dy="19">comparison.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>