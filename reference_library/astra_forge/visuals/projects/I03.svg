<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">APOLLO CHANNEL TRADE SPACE research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / I03 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">APOLLO CHANNEL TRADE SPACE</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">How do generic channel geometry tradeoffs affect cooling and pumping</tspan><tspan x="28" dy="22">burdens?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Published channel heat-transfer/pressure-drop</tspan><tspan x="46" dy="19">benchmarks, geometry ratios and material properties;</tspan><tspan x="46" dy="19">educational comparison only, not detailed engine</tspan><tspan x="46" dy="19">design.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Hydraulic diameter Dh=4A/Pwet; pressure</tspan><tspan x="506" dy="19">loss=friction_factor*(L/Dh)*rho*v^2/2; heat transfer</tspan><tspan x="506" dy="19">depends on Reynolds/Prandtl regime and geometry</tspan><tspan x="506" dy="19">validity.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Correlation domain checks, independent benchmark and</tspan><tspan x="46" dy="19">heat/pressure balance; include roughness, uncertainty</tspan><tspan x="46" dy="19">and thermal stress.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Nondimensional cooling/pumping frontier, channel</tspan><tspan x="506" dy="19">schematic, model-validity masks.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>