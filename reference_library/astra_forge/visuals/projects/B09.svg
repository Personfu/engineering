<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">TERRA HYDROTHERMAL ATLAS research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / B09 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">TERRA HYDROTHERMAL ATLAS</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Which chemical patterns are spatially supported by actual sampling</tspan><tspan x="28" dy="22">density?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">USGS water chemistry, sample UTC, location precision,</tspan><tspan x="46" dy="19">charge balance, units, detection limits and laboratory</tspan><tspan x="46" dy="19">method.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Standardize species-specific concentrations;</tspan><tspan x="506" dy="19">interpolate only within support using Gaussian-process</tspan><tspan x="506" dy="19">covariance K; distinguish prediction variance from</tspan><tspan x="506" dy="19">analytical uncertainty.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Leave-one-site-out validation; assess charge balance;</tspan><tspan x="46" dy="19">show sampled points and mask unsupported</tspan><tspan x="46" dy="19">extrapolation.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Geochemical facies map, sample receipts, prediction</tspan><tspan x="506" dy="19">uncertainty surface.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>