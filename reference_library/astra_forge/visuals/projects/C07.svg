<title id="t">LIGO MEMORY BRIDGE research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / C07 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">LIGO MEMORY BRIDGE</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">How do finite waveform endpoints change low-frequency memory estimates?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Published supernova waveform libraries, sampling</tspan><tspan x="46" dy="19">intervals, polarization, units and explicit synthetic</tspan><tspan x="46" dy="19">memory steps; GWOSC noise records for context.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Observed h_window=w(t)*h(t); memory</tspan><tspan x="506" dy="19">Delta_h=h(late)-h(early); Fourier-domain low-frequency</tspan><tspan x="506" dy="19">behavior depends on endpoint continuation and window</tspan><tspan x="506" dy="19">normalization.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Recover known injected memory; compare taper families</tspan><tspan x="46" dy="19">and record-length convergence; no invented detection</tspan><tspan x="46" dy="19">claims.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Time-domain memory and taper, low-frequency spectra,</tspan><tspan x="506" dy="19">continuation sensitivity.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>