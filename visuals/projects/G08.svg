<title id="t">ORION REGENERATION EVIDENCE research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / G08 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">ORION REGENERATION EVIDENCE</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Which published mechanisms can be represented without overclaiming</tspan><tspan x="28" dy="22">causality or treatment relevance?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Peer-reviewed mechanistic evidence and public omics;</tspan><tspan x="46" dy="19">original project is listed as title-only in the</tspan><tspan x="46" dy="19">historical program; no clinical or therapeutic</tspan><tspan x="46" dy="19">optimization.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Conceptual state model dH/dt=proliferation-signaled</tspan><tspan x="506" dy="19">loss; causal graph separates observed associations,</tspan><tspan x="506" dy="19">experimentally supported links and hypothetical</tspan><tspan x="506" dy="19">feedback.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Parameter identifiability, alternative mechanisms and</tspan><tspan x="46" dy="19">independent evidence; avoid treating an unvalidated</tspan><tspan x="46" dy="19">ODE as a medical prediction.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Mechanism evidence graph, identifiability map,</tspan><tspan x="506" dy="19">research-gap ledger.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>