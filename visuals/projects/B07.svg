<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">TERRA CLEAN SOIL research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / B07 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">TERRA CLEAN SOIL</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">What do published remediation observations establish about contaminant</tspan><tspan x="28" dy="22">removal and residual risk?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Published concentration time series, analytical</tspan><tspan x="46" dy="19">detection limits, matrix, controls and measured</tspan><tspan x="46" dy="19">byproducts; no handling or treatment recipe.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Retrospective first-order reference C=C0*exp(-k*t);</tspan><tspan x="506" dy="19">mass balance includes sorbed fraction, transformation</tspan><tspan x="506" dy="19">products and uncertainty. Removal is not proof of</tspan><tspan x="506" dy="19">detoxification.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Compare censored fits and abiotic controls; require</tspan><tspan x="46" dy="19">byproduct accounting; do not optimize explosive</tspan><tspan x="46" dy="19">compound production or disposal operations.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Concentration decay with censored points, mass-balance</tspan><tspan x="506" dy="19">Sankey, residual-risk matrix.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>