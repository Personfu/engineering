<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">SUPERNOVA ISOTOPE FOUNDRY research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / A12 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">SUPERNOVA ISOTOPE FOUNDRY</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">Can isotopic mixtures distinguish candidate stellar sources without</tspan><tspan x="28" dy="22">overfitting endmembers?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Published Ti/Cr isotopic ratios, standards,</tspan><tspan x="46" dy="19">uncertainties and stellar-yield tables; sample</tspan><tspan x="46" dy="19">contamination metadata.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">ratio_mix=sum(f_i*N_num_i)/sum(f_i*N_den_i),</tspan><tspan x="506" dy="19">sum(f_i)=1; isotope anomaly</tspan><tspan x="506" dy="19">epsilon=1e4*(Rsample/Rstandard-1). Mixing ratios are</tspan><tspan x="506" dy="19">abundance-weighted, not arithmetic averages.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Fit joint isotopes with correlated errors; compare</tspan><tspan x="46" dy="19">alternative yield grids; reserve isotopes for</tspan><tspan x="46" dy="19">posterior predictive checking.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Isotope mixing triangles, posterior fractions, yield-</tspan><tspan x="506" dy="19">family comparison.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>