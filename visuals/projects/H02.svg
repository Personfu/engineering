<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">OSIRIS BENNU PHOTOMETRY research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / H02 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">OSIRIS BENNU PHOTOMETRY</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">How do calibration choices affect quantitative OCAMS image</tspan><tspan x="28" dy="22">interpretation?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">PDS OCAMS raw/calibrated products, calibration files,</tspan><tspan x="46" dy="19">exposure, filter, geometry kernels and product</tspan><tspan x="46" dy="19">versions.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Reference signal=(raw-bias-dark)/(flat*exposure);</tspan><tspan x="506" dy="19">conversion to radiance and I/F requires instrument</tspan><tspan x="506" dy="19">coefficients and solar geometry; use the official</tspan><tspan x="506" dy="19">pipeline for science output.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Official-product comparison, saturation/bad-pixel</tspan><tspan x="46" dy="19">masks and calibration version audit; a simplified</tspan><tspan x="46" dy="19">correction is not the OCAMS calibration pipeline.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Raw/calibrated/residual view, Bennu geometry context,</tspan><tspan x="506" dy="19">coefficient lineage.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>