<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
<title id="t">TERRA COMMUNITY CLIMATE research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / H05 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">TERRA COMMUNITY CLIMATE</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">How can community-led climate support preserve authority, priorities and</tspan><tspan x="28" dy="22">data sovereignty?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Original project context, authorized community</tspan><tspan x="46" dy="19">materials and official climate products; permissions</tspan><tspan x="46" dy="19">and intended audience precede publication.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Decision/evidence matrix links community-approved</tspan><tspan x="506" dy="19">objective, climate hazard, source, uncertainty and</tspan><tspan x="506" dy="19">reviewed adaptation option; no invented departmental</tspan><tspan x="506" dy="19">mandate.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Community review, scenario-date audit and geographic</tspan><tspan x="46" dy="19">representativeness; do not repackage private or</tspan><tspan x="46" dy="19">Indigenous knowledge as public open data.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Adaptation evidence timeline, approved regional</tspan><tspan x="506" dy="19">context, source/permission ledger.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>