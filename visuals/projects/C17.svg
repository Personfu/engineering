<title id="t">GEMINI DISK SENTINEL research architecture</title><desc id="d">Conceptual research workflow. No observations or results are depicted. Full details appear in the associated dossier.</desc>
<rect width="960" height="545" fill="#070e1b"/><g font-family="sans-serif"><text x="28" y="35" fill="#91a1b8" font-size="12">ASTRA FORGE / C17 / PROPOSED RESEARCH ARCHITECTURE</text><text x="28" y="69" fill="#edf5ff" font-size="23">GEMINI DISK SENTINEL</text><text x="28" y="83" fill="#b8c8d9" font-size="14"><tspan x="28" dy="22">How do disk morphology and processing affect point-source detectability?</tspan></text><rect x="28" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="182" fill="#66d6ee" font-size="12">OBSERVATION CONTRACT</text><text x="46" y="195" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">Public GPI datasets, PSF, observing geometry,</tspan><tspan x="46" dy="19">reduction version and injected companion truth; verify</tspan><tspan x="46" dy="19">archive access and licensing.</tspan></text><rect x="488" y="155" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="182" fill="#66d6ee" font-size="12">MODEL &amp; ASSUMPTIONS</text><text x="506" y="195" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Contrast C(r)=flux_planet/flux_star; detection limit</tspan><tspan x="506" dy="19">determined by injection/recovery through the complete</tspan><tspan x="506" dy="19">reduction pipeline with throughput and small-sample</tspan><tspan x="506" dy="19">corrections.</tspan></text><rect x="28" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="46" y="352" fill="#66d6ee" font-size="12">INDEPENDENT CHECK</text><text x="46" y="365" fill="#cfdae6" font-size="12"><tspan x="46" dy="19">False-positive rate, blind injections and disk-</tspan><tspan x="46" dy="19">correlated residuals; contrast-to-mass conversion</tspan><tspan x="46" dy="19">requires age and evolutionary model uncertainty.</tspan></text><rect x="488" y="325" width="430" height="148" rx="8" fill="#101c30" stroke="#264864"/><text x="506" y="352" fill="#66d6ee" font-size="12">PROPOSED OUTPUT</text><text x="506" y="365" fill="#cfdae6" font-size="12"><tspan x="506" dy="19">Contrast curve, injection map, disk residuals,</tspan><tspan x="506" dy="19">completeness surface.</tspan></text><text x="28" y="521" fill="#91a1b8" font-size="12">CONCEPTUAL / NOT TO SCALE / NO MEASURED RESULTS / ORIGINAL FLLC SCHEMATIC</text></g></svg>