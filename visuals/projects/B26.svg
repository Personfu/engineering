<text x="50" y="75" class="tag">QUESTION</text>
<text x="50" y="100" class="body">Which dispatch policy balances curtailed solar, hydrogen cost, load service and electrolyzer</text>
<text x="50" y="121" class="body">lifetime across weather and demand uncertainty?</text>
<path d="M460 159 v13 m-5 -5 l5 5 l5 -5" fill="none" stroke="#225fc5" stroke-width="2"/>
