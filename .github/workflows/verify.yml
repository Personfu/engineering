name: Verify engineering documentation and models
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r models/requirements.txt -r tools/requirements-dev.txt
      - run: python tools/build_engineering_documentation.py
      - run: git diff --exit-code
      - run: python reviews/verify_portfolio.py
      - run: python reviews/verify_data_contracts.py
      - run: python -m unittest -v test_models.py
        working-directory: models
      - run: python -m unittest discover -s tests -v
        working-directory: reference_library/astra_forge
